    default_properties:
      - Linux
      - Debian
      - AppServer
      - GoRuntime
      - ServiceToken
      - AdminCredentials
      - Unpatched
    is_goal: false

  # ── Data Tier ──────────────────────────────────────────────────────────────
  MySQLServer:
    port: MySQL
    value: 1000
    allowed_os:
      - Linux
    default_properties:
      - Linux
      - Debian
      - DatabaseServer
      - MySQL
      - SensitiveData
      - Patched
    is_goal: false

  MongoDBServer:
    port: MongoDB
    value: 5000
    allowed_os:
      - Linux
    default_properties:
      - Linux
