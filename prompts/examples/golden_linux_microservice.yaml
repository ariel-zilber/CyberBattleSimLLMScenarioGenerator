    value: 8000
    allowed_os:
      - Linux
    default_properties:
      - Linux
      - Debian
      - WorkerNode
      - MessageBroker
      - Java
      - SensitiveData
      - Unpatched
    is_goal: true

domains:
  - name: WebTier
    subnet: 10.0.1.0/24
    filler:
      - NginxProxy
    mandatory_services:
      - NginxProxy
      - WordPressServer
    groups:
      - name: NginxProxies
        service: NginxProxy
        min_count: 2
        max_count: 5
      - name: WordPressServers
        service: WordPressServer
        min_count: 1
        max_count: 4
    constraints:
      - source: NginxProxies
        target: Unpatched
        relation: MUST_HAVE
      - source: WordPressServers
        target: Unpatched
        relation: MUST_HAVE

  - name: AppTier
    subnet: 10.0.2.0/24
    filler:
      - GrafanaServer
    mandatory_services:
      - JenkinsServer
      - VaultServer
      - GrafanaServer
    groups:
      - name: JenkinsServers
        service: JenkinsServer
        min_count: 1
        max_count: 3
      - name: VaultServers
        service: VaultServer
        min_count: 1
        max_count: 2
      - name: GrafanaServers
        service: GrafanaServer
        min_count: 1
        max_count: 3
    constraints:
      - source: JenkinsServers
        target: Unpatched
        relation: MUST_HAVE
      - source: VaultServers
        target: Unpatched
        relation: MUST_HAVE
      - source: GrafanaServers
        target: Unpatched
        relation: MUST_HAVE
      # Jenkins holds Vault tokens — primary credential pivot
      - source: JenkinsServers
        target: VaultServers
        relation: LEAK_KNOWN_CREDENTIALS
        protocol: VaultAPI
      - source: JenkinsServers
        target: VaultServers
        relation: MUST_CONNECT
        protocol: VaultAPI
      # Grafana connects to Vault for data source cred management
      - source: GrafanaServers
        target: VaultServers
        relation: MUST_REACH
        protocol: VaultAPI

  - name: DataTier
    subnet: 10.0.3.0/24
    filler:
      - RedisServer
    mandatory_services:
      - MySQLServer
      - MongoDBServer
      - RedisServer
    groups:
      - name: MySQLServers
        service: MySQLServer
        min_count: 1
        max_count: 3
      - name: MongoDBServers
        service: MongoDBServer
        min_count: 1
        max_count: 3
      - name: RedisServers
        service: RedisServer
        min_count: 1
        max_count: 2
    constraints:
      - source: MongoDBServers
        target: Unpatched
        relation: MUST_HAVE
      # Vault issues credentials to data stores
      - source: MongoDBServers
        target: Misconfigured
        relation: MUST_HAVE

  - name: AuthTier
    subnet: 10.0.4.0/24
    filler: []
    mandatory_services:
      - KeycloakServer
    groups:
      - name: KeycloakServers
        service: KeycloakServer
        min_count: 1
        max_count: 2
    constraints:
      - source: KeycloakServers
        target: Unpatched
        relation: MUST_HAVE

  - name: WorkerTier
    subnet: 10.0.5.0/24
    filler:
      - AirflowServer
    mandatory_services:
      - AirflowServer
      - KafkaServer
    groups:
      - name: AirflowServers
        service: AirflowServer
        min_count: 1
        max_count: 3
      - name: KafkaServers
        service: KafkaServer
        min_count: 1
        max_count: 3
    constraints:
      - source: AirflowServers
        target: Unpatched
        relation: MUST_HAVE
      - source: KafkaServers
        target: Unpatched
        relation: MUST_HAVE
      - source: AirflowServers
        target: Misconfigured
        relation: MUST_HAVE
      # Airflow holds Kafka SASL creds in connection store
      - source: AirflowServers
        target: KafkaServers
        relation: LEAK_KNOWN_CREDENTIALS
        protocol: Kafka
      - source: AirflowServers
        target: KafkaServers
        relation: MUST_CONNECT
        protocol: Kafka

inter_domain_constraints:
  # WebTier → AppTier (HTTPS/REST only — no DB ports)
  - source_domain: WebTier
    target_domain: AppTier
    constraints:
      - source: NginxProxies
        target: JenkinsServers
        relation: MUST_CONNECT
        protocol: JenkinsHTTPS
      - source: NginxProxies
        target: JenkinsServers
        relation: LEAK_KNOWN_CREDENTIALS
        protocol: JenkinsHTTPS
      - source: WordPressServers
        target: VaultServers
        relation: MUST_REACH
        protocol: VaultAPI
      - source: WordPressServers
        target: VaultServers
        relation: LEAK_KNOWN_CREDENTIALS
        protocol: VaultAPI

  # WebTier → DataTier (WordPress reads MySQL directly — wp-config.php)
  - source_domain: WebTier
    target_domain: DataTier
    constraints:
      - source: WordPressServers
        target: MySQLServers
        relation: MUST_CONNECT
        protocol: MySQL
      - source: WordPressServers
        target: MySQLServers
        relation: LEAK_KNOWN_CREDENTIALS
        protocol: MySQL

  # AppTier → DataTier (port-specific only)
  - source_domain: AppTier
    target_domain: DataTier
    constraints:
      - source: VaultServers
        target: MySQLServers
        relation: CLIENT_OF
        protocol: MySQL
      - source: VaultServers
        target: MySQLServers
        relation: LEAK_KNOWN_CREDENTIALS
        protocol: MySQL
      - source: VaultServers
        target: MongoDBServers
        relation: CLIENT_OF
        protocol: MongoDB
      - source: VaultServers
        target: MongoDBServers
        relation: LEAK_KNOWN_CREDENTIALS
        protocol: MongoDB
      - source: GrafanaServers
        target: MySQLServers
        relation: MUST_REACH
        protocol: MySQL
      - source: GrafanaServers
        target: MongoDBServers
        relation: MUST_REACH
        protocol: MongoDB
      - source: GrafanaServers
        target: RedisServers
        relation: MUST_REACH
        protocol: Redis

  # AppTier → AuthTier (HTTPS only — no WebTier direct access)
  - source_domain: AppTier
    target_domain: AuthTier
    constraints:
      - source: JenkinsServers
        target: KeycloakServers
        relation: MUST_REACH
        protocol: KeycloakHTTPS
      - source: VaultServers
        target: KeycloakServers
        relation: MUST_CONNECT
        protocol: KeycloakHTTPS
      - source: VaultServers
        target: KeycloakServers
        relation: LEAK_KNOWN_CREDENTIALS
        protocol: KeycloakHTTPS

  # AppTier → WorkerTier (Kafka producer access)
  - source_domain: AppTier
    target_domain: WorkerTier
    constraints:
      - source: JenkinsServers
        target: KafkaServers
        relation: MUST_REACH
        protocol: Kafka

  # DataTier → AuthTier (MySQL creds can be pivoted to Keycloak admin)
  - source_domain: DataTier
    target_domain: AuthTier
    constraints:
      - source: MySQLServers
        target: KeycloakServers
        relation: LEAK_KNOWN_CREDENTIALS
        protocol: KeycloakHTTPS

  # WorkerTier → DataTier (Kafka → MongoDB event stream)
  - source_domain: WorkerTier
    target_domain: DataTier
    constraints:
      - source: KafkaServers
        target: MongoDBServers
        relation: MUST_REACH
        protocol: MongoDB

  # WorkerTier → AuthTier (Kafka event stream includes Keycloak events)
  - source_domain: WorkerTier
    target_domain: AuthTier
    constraints:
      - source: KafkaServers
        target: KeycloakServers
        relation: MUST_REACH
        protocol: KeycloakHTTPS

entry_points:
  - domain: WebTier
    node: NginxProxies

solvability_rules:
  entry_point_requirements:
    min_remote_vulnerabilities: 1
    min_credential_leaking_vulnerabilities: 1
  lateral_movement_requirements:
    min_credential_leaking_nodes: 0.55
  auto_fix_enabled: true
  auto_fix_strategies:
    - add_remote_vulnerability_to_entry
    - add_credential_leakage
    - add_lateral_movement_vulnerabilities
