  # ── Web Tier ──────────────────────────────────────────────────────────────
  NginxProxy:
    port: HTTPS
    value: 300
    allowed_os:
      - Linux
    default_properties:
      - Linux
      - Alpine
      - WebServer
      - LibCrypto
      - ServiceToken
      - Unpatched
    is_goal: false

  WordPressServer:
    port: HTTPS
    value: 500
    allowed_os:
      - Linux
    default_properties:
      - Linux
      - Debian
      - WebServer
      - PHP
      - ImageMagick
      - WordPressInstall
      - Unpatched
    is_goal: false

  # ── App Tier ──────────────────────────────────────────────────────────────
  JenkinsServer:
    port: JenkinsHTTPS
    value: 1000
    allowed_os:
      - Linux
    default_properties:
      - Linux
      - Debian
      - AppServer
      - Java
      - ServiceToken
      - Unpatched
    is_goal: false

  GrafanaServer:
