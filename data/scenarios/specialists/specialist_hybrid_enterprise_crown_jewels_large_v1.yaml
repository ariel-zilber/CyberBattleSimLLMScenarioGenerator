constraint_vulnerabilities:
  leak_known_credentials:
    name: Solvability.PassTheHash
    type: LOCAL
    description: 'Credential relay across zone boundaries: NTLM hash capture via network
      position, cached domain creds from LSASS, and service account tickets leaked
      from compromised domain-joined nodes.

      '
    cost: 0.5
    success_rate: 0.7
    reward: Credentials relayed from {target} — domain or service account credential
      obtained for zone crossing
    node_probability: 0.25
    target_coverage: 0.25
    min_targets: 2
    default_port: SMB
  leak_neighbors:
    name: Solvability.BloodHound_Recon
    type: LOCAL
    description: 'Multi-technique network discovery: ARP cache, SMB enumeration, LDAP
      queries, and SNMP walk to map adjacent hosts across zone boundaries.

      '
    cost: 0.5
    success_rate: 0.85
    reward: Adjacent node {target} discovered via SMB/ARP/LDAP cross-zone enumeration
    node_probability: 0.6
    target_coverage: 0.5
    min_targets: 2
probe_vulnerabilities:
- name: Solvability.CiscoIOS_RPKI
  os: Linux
  type: REMOTE
  description: Banner grab, SNMP OID walk, and web UI fingerprint to identify network
    device vendor, firmware version, and management interface exposure.
  cost: 0.5
  success_rate: 0.85
- name: Solvability.WSD_RCE
  os: Windows
  type: REMOTE
  description: SMB/RDP banner, NetBIOS name, and LDAP signing check to identify Windows
    OS version, patch level, and domain membership.
  cost: 0.5
  success_rate: 0.9
solvability_vulnerabilities:
  remote_access:
  - name: Solvability.PanOS_CMDInject
    type: REMOTE
    description: 'CVE-2024-3400 — PAN-OS GlobalProtect OS command injection. CVSS
      10.0. Unauthenticated RCE via crafted SESSID cookie in GlobalProtect gateway.
      Achieves root shell on Palo Alto WAF/NGFW appliance in Z4.

      '
    cost: 1.0
    success_rate: 0.9
    reward: PAN-OS GlobalProtect RCE (CVE-2024-3400) achieved — root shell on WAF,
      Z4 foothold established
    match_properties:
    - Firewall
    - PaloAlto
    - PANOS
    - GlobalProtect
    probability: 0.85
  - name: Solvability.PanOS_TOCTOU
    type: REMOTE
    description: 'CVE-2021-3054 — PAN-OS Web UI TOCTOU race condition. CVSS 7.2. Authenticated
      admin command injection through management UI race window.

      '
    cost: 1.5
    success_rate: 0.85
    reward: PAN-OS TOCTOU Web UI exploit (CVE-2021-3054) — management shell on PaloAlto
      appliance
    match_properties:
    - Firewall
    - PaloAlto
    - PANOS
    probability: 0.7
  - name: Solvability.CiscoIOS_XE_PrivEsc
    type: REMOTE
    description: 'CVE-2023-20198 — Cisco IOS XE Web UI privilege escalation. CVSS
      10.0. Unauthenticated creation of high-privilege account via HTTP management
      interface on Cisco IOS XE routers (CiscoEdgeRouter Z2).

      '
    cost: 1.0
    success_rate: 0.9
    reward: Cisco IOS XE priv-esc (CVE-2023-20198) — privileged account created on
      CiscoEdgeRouter, Z2 breached
    match_properties:
    - Router
    - CiscoIOS
    - NetworkDevice
    - Unpatched
    probability: 0.8
  - name: Solvability.WSD_RCE
    type: REMOTE
    description: 'CVE-2023-28250 — Windows Pragmatic General Multicast (PGM) RCE.
      CVSS 9.8. Unauthenticated stack overflow via Windows Socket Driver on Win10/Win11
      workstations with PGM service enabled.

      '
    cost: 1.0
    success_rate: 0.9
    reward: WSD RCE (CVE-2023-28250) — SYSTEM shell on AdminWorkstation/SalesWorkstation
      in Z1 VLANs
    match_properties:
    - Windows
    - Workstation
    probability: 0.75
  - name: Solvability.ProxyLogon
    type: REMOTE
    description: 'CVE-2023-23397 — Outlook NTLM credential relay. CVSS 9.8. Malicious
      calendar appointment forces Outlook to authenticate to attacker-controlled SMB
