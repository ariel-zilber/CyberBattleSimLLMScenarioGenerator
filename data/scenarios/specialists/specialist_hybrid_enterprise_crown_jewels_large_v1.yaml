    success_rate: 0.9
    reward: Outlook NTLM relay (CVE-2023-23397) — domain user NTLMv2 hash captured
      from AdminWorkstation
    match_properties:
    - Windows
    - DomainJoined
    probability: 0.7
  - name: Solvability.Certifried
    type: REMOTE
    description: 'CVE-2022-26923 — Certifried ADCS privilege escalation. CVSS 8.8.
