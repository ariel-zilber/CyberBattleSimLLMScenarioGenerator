start_node:
  subnet: 0.0.0.0/0
  ip: 203.0.113.5
  properties:
  - breach_node
  default_entry_port: HTTPS
  preferred_entry_ports:
  - HTTPS
  - HTTP
  entry_node_count: 1
  leaked_node_coverage: 0.15
  min_leaked_nodes: 2
  port_selection: random
  vulnerabilities:
    discovery:
      name: Solvability.LDAP_Enum
      type: LOCAL
      description: 'OSINT and network scanning to enumerate public-facing infrastructure:
        WAF, IPS, ISP router in Z4. Identifies Palo Alto GlobalProtect portal, IPS
        management UI, and SNMP AS number for the GLOBALTECH enterprise.

        '
      cost: 0.5
      success_rate: 0.85
      reward: GLOBALTECH internet edge fingerprinted — Z4 WAF/IPS/ISPRouter identified,
        PAN-OS version and GlobalProtect portal URL enumerated
    credential_leak:
      name: Solvability.SSH_PrivKey_Theft
      type: LOCAL
      description: 'Spear-phishing targeting GLOBALTECH employees with fake VPN /
        GlobalProtect login portal. Harvests one VPN credential for initial Z4 foothold.

        '
      cost: 1.5
      success_rate: 0.65
      reward: GLOBALTECH VPN credential obtained via phishing — initial foothold credential
        for GlobalProtect portal
