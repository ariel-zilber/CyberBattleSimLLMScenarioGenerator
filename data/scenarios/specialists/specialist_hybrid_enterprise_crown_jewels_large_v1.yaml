metadata:
  scenario_id: SPECIALIST-SPECIALIST-META-HYBRID-ENTERPRISE-CROWN-JEWELS-LARGE-V1
  agent: Meta
  training_mode: specialist_meta
  zones:
  - Z4_InternetEdge
  - Z2_HQEdge
  - Z1_HQVLANs
  - Z1_ServerFarm
  - Z8_KeyMgmt
  terminal_goal: CyberArkPAM
  intermediate_goals:
  - name: DomainController
    value: 6000
    reason: 'High-value intermediate hub — owning DC unlocks Z8 path via ADCS cert
      but episode does NOT terminate here. Agent must learn to continue to Z8.

      '
  - name: ftpd
    value: 1500
    reason: S_Linux milestone — Linux artifact/file server compromised; credential
      extraction enables S_Identity DC path
  - name: AdminWorkstation
    value: 2500
    reason: S_Windows + S_Lateral milestone — Windows foothold established via credential
      relay; gates ADCS path to DomainController
  node_range:
  - 300
  - 450
  attack_path:
  - Probe — fingerprint WAF in Z4 (breach node, public IP 203.0.113.5)
  - Z4 exploit — PanOS_CMDInject (CVE-2024-3400, SR 0.90) on WAF → pivot to IPSAppliance
  - Z4→Z2 — CiscoIOS_XE_PrivEsc (CVE-2023-20198, SR 0.90) on CiscoEdgeRouter (Z2)
  - Z2→Z1 lateral — S_Lateral NTLM_Relay_SMB from PaloAltoFirewall into HQ VLANs
  - Z1 VLAN RCE — WSD_RCE (CVE-2023-28250, SR 0.90) on AdminWorkstation
  - Z1 credential harvest — Mimikatz_NTLM on owned workstations → service account
    creds
  - Z1 Server Farm — PrintNightmare (CVE-2021-34527, SR 0.88) on ExchangeServer
  - S_Identity — Certifried (CVE-2022-26923, SR 0.88) + DCSync on DomainController
    (value 6000, NOT terminal)
  - DC→Z8 lateral — ADCS_CertSpoof_Lateral (CVE-2022-34691, SR 0.88) → CyberArkPAM
  - TERMINAL — CyberArkPAM owned (value 10000, Z8)
  notes: 'Specialist-meta dataset variant: Hybrid enterprise crown-jewel scenario
    with Windows, identity, credential movement, perimeter, cloud, branch, and management-plane
    context.

    Size stratum: large; target node range 300-450; target goal count approximately
    6.

    Intended specialist emphasis: S_Windows, S_Identity, S_Linux. Optional/supporting
    specialists: S_Network, S_Lateral.

    Each generated instance should contain meaningful causal segments for 3-4 specialist
    domains,

    include at least one bridge role from S_Identity or S_Lateral, and preserve the
    GLOBALTECH

    reference architecture with external/perimeter, HQ edge, internal/server-farm,
    branch/cloud,

    and management or crown-jewel context. Decoys and supporting assets are allowed
    but must not

    dominate or block the main multi-specialist paths.

    DomainController is is_goal: false (value 6000). Episode does NOT terminate there.

    CyberArkPAM is is_goal: true (value 10000). CyberArkPAM must NOT have Unauthenticated
    property.

    Z8 (192.168.100.0/24) is only reachable after DC is owned (ADCS cert chain prerequisite).

    The 4-domain inter_domain_constraints define the kill chain connectivity.

    '
  source_template: /home/ariel/Documents/thesis/CyberBattleSimLLMScenarioGenerator/data/scenarios/specialist_meta/meta_hybrid_enterprise_crown_jewels_large_v1.yaml
  fixed_specialists:
  - s_network
  - s_linux
  - s_windows
  - s_identity
  - s_lateral
  vocabulary_source: /home/ariel/Documents/thesis/CyberBattleSim/cyberbattle/data/global_vocabulary.yaml
