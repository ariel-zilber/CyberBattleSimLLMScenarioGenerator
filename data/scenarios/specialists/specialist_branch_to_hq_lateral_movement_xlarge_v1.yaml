constraint_vulnerabilities:
  leak_known_credentials:
    name: Solvability.PassTheHash
    type: LOCAL
    description: Multi-zone credential relay — running-config and VPN PSK from branch
      network devices; LSASS/SAM on Windows hosts. Enables Z5 VPN PSK reuse into Z2
      and Windows NTLM relay into Z1.
    cost: 1.0
    success_rate: 0.7
    reward: Credentials relayed from {target} — VPN PSK or domain credential chain
      advanced
    node_probability: 0.25
    target_coverage: 0.25
    min_targets: 1
    default_port: SMB
  leak_neighbors:
    name: Solvability.BloodHound_Recon
    type: LOCAL
    description: ARP/CDP/LLDP on network devices; Windows LDAP/net commands for Z1
      domain host discovery. Reveals adjacent nodes across Z5, Z2, and Z1.
    cost: 0.5
    success_rate: 0.85
    reward: Branch-to-HQ topology discovered — {target} and adjacent Z2/Z1 hosts enumerated
    node_probability: 0.65
    target_coverage: 0.45
    min_targets: 1
