metadata:
  scenario_id: SPECIALIST-SPECIALIST-META-BRANCH-TO-HQ-LATERAL-MOVEMENT-XLARGE-V1
  agent: Meta
  training_mode: specialist_meta
  zones:
  - Z5_BranchOffice
  - Z2_HQEdge
  - Z1_ServerFarm
  terminal_goal: DomainController
  intermediate_goals:
  - name: JuniperRouter
    value: 1000
    reason: Z5 entry node — branch perimeter breach reward
  - name: FortiGateAppliance
    value: 2500
    reason: Z2 entry reward — Z5→Z2 VPN crossing traversal
  - name: SalesWorkstation
    value: 1000
    reason: Z1 entry reward — Z2→Z1 domain crossing triggers S_Windows routing
  - name: AdminWorkstation
    value: 1500
    reason: S_Lateral milestone — NTLM relay from Z2 pivot lands on Z1 Windows admin
      host; unlocks S_Identity DC path
  node_range:
  - 700
  - 950
  attack_path:
  - Probe — Solvability.CiscoIOS_RPKI fingerprints JuniperRouter / CiscoEdgeRouter
    in Z5 (breach node)
  - Z5 exploit — FortiOS_SSLVPN_RCE (CVE-2023-27997) on JuniperRouter + CiscoIOS_RPKI
    on CiscoEdgeRouter
  - Z5 config extraction — ConfigBackup_Exfil from CiscoEdgeRouter → VPN pre-shared
    key + Z2 subnet routes
  - Z5→Z2 VPN relay — VPN PSK reuse → FortiGate SSLVPN session established in HQ Edge
  - Z2 escalation — CiscoIOS_XE_PrivEsc (CVE-2023-20198) on CiscoNXOS → HQ edge owned
  - Z2→Z1 relay — NTLM relay via compromised Z2 CiscoNXOS → SalesWorkstation domain
    foothold
  - S_Windows — WSD_RCE (CVE-2023-28250) + PrintNightmare on workstations → domain_foothold
    = true
  - S_Identity — BloodHound_Recon + DCSync on DomainController → TERMINAL GOAL (value
    10000)
  notes: 'Specialist-meta dataset variant: Branch-to-HQ scenario emphasizing network
    boundary traversal, Windows footholds, and credential-based lateral movement.

    Size stratum: xlarge; target node range 700-950; target goal count approximately
    8.

    Intended specialist emphasis: S_Network, S_Windows, S_Lateral. Optional/supporting
    specialists: S_Identity, S_Linux.

    Each generated instance should contain meaningful causal segments for 3-4 specialist
    domains,

    include at least one bridge role from S_Identity or S_Lateral, and preserve the
    GLOBALTECH

    reference architecture with external/perimeter, HQ edge, internal/server-farm,
    branch/cloud,

    and management or crown-jewel context. Decoys and supporting assets are allowed
    but must not

    dominate or block the main multi-specialist paths.

    Stage 2 branch-to-HQ scenario. Smaller device variety in Z5 (JuniperRouter, CiscoEdgeRouter
    only)

    versus full Z4 Internet Edge. Meta-agent must still route S_Network on branch
    appliances.

    Z5 subnet 10.2.0.0/24; Z2 HQ Edge 10.0.2.0/24; Z1 Server Farm 10.1.10.0/24.

    VPN PSK reuse is modeled via ConfigBackup_Exfil + inter_domain LEAK_KNOWN_CREDENTIALS.

    All Z5 values ≤2000; Z2 values 2500–4500; Z1 values 1000–10000.

    '
  source_template: /home/ariel/Documents/thesis/CyberBattleSimLLMScenarioGenerator/data/scenarios/specialist_meta/meta_branch_to_hq_lateral_movement_xlarge_v1.yaml
  fixed_specialists:
  - s_network
