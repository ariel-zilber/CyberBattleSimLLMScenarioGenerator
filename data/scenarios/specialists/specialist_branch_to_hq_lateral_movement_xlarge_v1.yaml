domains:
- name: BranchOffice
  subnet: 10.2.0.0/24
  filler:
  - CiscoEdgeRouter
  mandatory_services:
  - CiscoEdgeRouter
  - JuniperRouter
  groups:
  - name: CiscoEdgeRouters
    service: CiscoEdgeRouter
    min_count: 2
    max_count: 8
  - name: JuniperRouters
    service: JuniperRouter
    min_count: 1
    max_count: 6
  - name: FinanceWorkstations
    service: FinanceWorkstation
    min_count: 1
    max_count: 4
  constraints:
  - source: JuniperRouters
    target: Unpatched
    relation: MUST_HAVE
  - source: CiscoEdgeRouters
    target: Misconfigured
    relation: MUST_HAVE
  - source: CiscoEdgeRouters
    target: JuniperRouters
    relation: MUST_CONNECT
    protocol: HTTPS
- name: HQ_Edge
  subnet: 10.0.2.0/24
  filler:
  - CiscoNXOS
  - FortiGateAppliance
  mandatory_services:
  - FortiGateAppliance
  - CiscoNXOS
  - CiscoFirepower
  groups:
  - name: FortiGateAppliances
    service: FortiGateAppliance
    min_count: 2
    max_count: 10
  - name: CiscoNXOSSwitches
    service: CiscoNXOS
    min_count: 2
    max_count: 12
  - name: CiscoFirepowers
    service: CiscoFirepower
    min_count: 1
    max_count: 6
  constraints:
  - source: FortiGateAppliances
    target: Unpatched
    relation: MUST_HAVE
  - source: FortiGateAppliances
    target: DomainAdmin
    relation: MUST_HAVE
  - source: CiscoNXOSSwitches
    target: Misconfigured
    relation: MUST_HAVE
  - source: FortiGateAppliances
    target: CiscoNXOSSwitches
    relation: MUST_CONNECT
    protocol: HTTPS
  - source: CiscoFirepowers
    target: CiscoNXOSSwitches
    relation: KNOWS
- name: Z1_ServerFarm
  subnet: 10.1.10.0/24
  filler:
  - SalesWorkstation
  - FileServer
  mandatory_services:
  - SalesWorkstation
  - AdminWorkstation
  - PrintServer
  - FileServer
  - ExchangeServer
  - ADCS_Server
  - DomainController
  groups:
  - name: SalesWorkstations
    service: SalesWorkstation
    min_count: 2
    max_count: 12
  - name: AdminWorkstations
    service: AdminWorkstation
    min_count: 2
    max_count: 10
  - name: PrintServers
    service: PrintServer
    min_count: 1
    max_count: 5
  - name: FileServers
    service: FileServer
    min_count: 2
    max_count: 10
  - name: ExchangeServers
    service: ExchangeServer
    min_count: 1
    max_count: 5
  - name: ADCS_Servers
    service: ADCS_Server
    min_count: 1
    max_count: 4
  - name: DomainControllers
    service: DomainController
    min_count: 1
    max_count: 4
  - name: wmi_svcs
    service: wmi_svc
    min_count: 1
    max_count: 3
  constraints:
  - source: DomainControllers
    target: DomainAdmin
    relation: MUST_HAVE
  - source: DomainControllers
    target: DomainAdmin
    relation: MUST_HAVE
  - source: ADCS_Servers
    target: ADCS
    relation: MUST_HAVE
  - source: FileServers
    target: Misconfigured
    relation: MUST_HAVE
  - source: AdminWorkstations
    target: DomainAdmin
    relation: MUST_HAVE
  - source: SalesWorkstations
    target: AdminWorkstations
    relation: MUST_CONNECT
    protocol: SMB
  - source: PrintServers
    target: DomainControllers
    relation: MUST_CONNECT
    protocol: LDAP
  - source: ExchangeServers
    target: DomainControllers
    relation: MUST_CONNECT
    protocol: LDAP
  - source: ADCS_Servers
    target: DomainControllers
    relation: MUST_CONNECT
    protocol: LDAP
  - source: FileServers
    target: DomainControllers
    relation: MUST_CONNECT
    protocol: SMB
inter_domain_constraints:
- source_domain: BranchOffice
  target_domain: HQ_Edge
  constraints:
  - source: JuniperRouters
    target: FortiGateAppliances
    relation: MUST_CONNECT
    protocol: HTTPS
  - source: CiscoEdgeRouters
    target: CiscoNXOSSwitches
    relation: MUST_CONNECT
    protocol: HTTPS
  - source: JuniperRouters
    target: CiscoNXOSSwitches
    relation: LEAK_KNOWN_CREDENTIALS
    protocol: HTTPS
  - source: CiscoEdgeRouters
    target: FortiGateAppliances
    relation: KNOWS
- source_domain: HQ_Edge
  target_domain: Z1_ServerFarm
  constraints:
  - source: CiscoNXOSSwitches
    target: SalesWorkstations
    relation: MUST_CONNECT
    protocol: HTTPS
  - source: FortiGateAppliances
    target: SalesWorkstations
    relation: MUST_CONNECT
    protocol: HTTPS
  - source: CiscoNXOSSwitches
    target: AdminWorkstations
    relation: LEAK_KNOWN_CREDENTIALS
    protocol: SMB
entry_points:
- domain: BranchOffice
  node: CiscoEdgeRouters
solvability_rules:
  entry_point_requirements:
    min_remote_vulnerabilities: 1
    min_credential_leaking_vulnerabilities: 1
  lateral_movement_requirements:
    min_credential_leaking_nodes: 0.5
  auto_fix_enabled: true
  auto_fix_strategies:
  - add_remote_vulnerability_to_entry
  - add_credential_leakage
  - add_lateral_movement_vulnerabilities
