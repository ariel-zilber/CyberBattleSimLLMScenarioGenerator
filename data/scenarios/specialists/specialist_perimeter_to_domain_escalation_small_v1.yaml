metadata:
  scenario_id: SPECIALIST-SPECIALIST-META-PERIMETER-TO-DOMAIN-ESCALATION-SMALL-V1
  agent: Meta
  training_mode: specialist_meta
  zones:
  - Z4_InternetEdge
  - Z2_HQEdge
  - Z1_ServerFarm
  terminal_goal: DomainController
  intermediate_goals:
  - name: FortiGateAppliance
    value: 2500
    reason: Z2 entry reward — inter-domain crossing Z4→Z2 traversal
  - name: SalesWorkstation
    value: 1000
    reason: Z1 entry reward — Z2→Z1 boundary crossing triggers domain_foothold
  - name: AdminWorkstation
    value: 2500
    reason: Near-goal — domain foothold established, gates S_Identity routing
  node_range:
  - 35
  - 50
  attack_path:
  - Probe — Solvability.CiscoIOS_RPKI fingerprints Z4 appliances (breach node)
  - Z4 exploit — PanOS_CMDInject (CVE-2024-3400) on WAF + F5_BIGIP_AuthBypass → Z4
    foothold
  - Z4 config extraction — ConfigBackup_Exfil + SNMP_CommunityDump → Z2 subnet credentials
  - Z4→Z2 relay — inter_domain credential relay → FortiGateAppliance session obtained
  - Z2 escalation — CiscoIOS_XE_PrivEsc (CVE-2023-20198) + FortiOS_SSLVPN_RCE → Z2
    perimeter owned
  - Z2→Z1 lateral — NTLM_Relay_SMB via compromised Z2 router → SalesWorkstation domain
    foothold
  - S_Windows prerequisite — WSD_RCE (CVE-2023-28250) + PrintNightmare on workstations
    → domain_foothold = true
  - S_Identity routing — BloodHound_Recon + DCSync + Certifried on DomainController
    → TERMINAL (value 10000)
  notes: 'Specialist-meta dataset variant: Perimeter-to-domain escalation scenario
    emphasizing network ingress, Windows foothold, and identity compromise.

    Size stratum: small; target node range 35-50; target goal count approximately
    3.

    Intended specialist emphasis: S_Network, S_Windows, S_Identity. Optional/supporting
    specialists: S_Lateral, S_Linux.

    Each generated instance should contain meaningful causal segments for 3-4 specialist
    domains,

    include at least one bridge role from S_Identity or S_Lateral, and preserve the
    GLOBALTECH

    reference architecture with external/perimeter, HQ edge, internal/server-farm,
    branch/cloud,

    and management or crown-jewel context. Decoys and supporting assets are allowed
    but must not

    dominate or block the main multi-specialist paths.

    Stage 2 three-zone chain. Key prerequisite: meta-agent must call S_Windows (Z1
    workstations)

    BEFORE S_Identity (DomainController). domain_foothold flag enforces this ordering.

    Without at least one Z1 workstation owned, S_Identity routing yields zero reward

    (DomainController has no remote CVEs — only AD technique goal_access entries).

    All Z4 values ≤2500; Z2 values 2500–4500; Z1 values 1000–10000.

    DomainController value 10000 is is_goal: true here (Stage 2 — no Z8 yet).

    '
  source_template: /home/ariel/Documents/thesis/CyberBattleSimLLMScenarioGenerator/data/scenarios/specialist_meta/meta_perimeter_to_domain_escalation_small_v1.yaml
  fixed_specialists:
  - s_network
  - s_linux
  - s_windows
  - s_identity
  - s_lateral
  vocabulary_source: /home/ariel/Documents/thesis/CyberBattleSim/cyberbattle/data/global_vocabulary.yaml
