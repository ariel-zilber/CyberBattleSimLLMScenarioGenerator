  - IPSAppliance
  mandatory_services:
  - WAFAppliance
  - IPSAppliance
  groups:
  - name: WAFs
    service: WAFAppliance
    min_count: 1
    max_count: 3
  - name: IPSAppliances
    service: IPSAppliance
    min_count: 1
    max_count: 3
  constraints:
  - source: WAFs
    target: breach_node
    relation: MUST_HAVE
  - source: WAFs
    target: Unpatched
    relation: MUST_HAVE
  - source: WAFs
    target: IPSAppliances
    relation: MUST_CONNECT
    protocol: HTTPS
- name: HQEdge
