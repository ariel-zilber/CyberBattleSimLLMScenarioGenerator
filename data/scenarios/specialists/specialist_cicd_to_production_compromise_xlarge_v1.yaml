  default_entry_port: HTTPS
  preferred_entry_ports:
  - HTTPS
  - HTTP
  entry_node_count: 1
  leaked_node_coverage: 0.2
  min_leaked_nodes: 3
  port_selection: random
  vulnerabilities:
    discovery:
      name: Solvability.LDAP_Enum
      type: LOCAL
      description: 'Internet-facing reconnaissance reveals two GLOBALTECH attack surfaces:
        (1) Z4 Palo Alto GlobalProtect WAF/VPN gateway at 10.0.1.x, (2) Z6 AWS nginx
        WebTier at 10.3.0.x. Both are fingerprinted and viable. The agent must explore
        both to determine the faster path.

        '
      cost: 0.5
      success_rate: 0.85
      reward: Dual attack surface identified — Z4 WAF (PAN-OS) and Z6 WebTier (nginx/libcrypto)
        both fingerprinted and accessible
    credential_leak:
      name: Solvability.SSH_PrivKey_Theft
      type: LOCAL
      description: 'Dual phishing campaign — harvests either a GlobalProtect VPN credential
        (for Z4 initial access) or an AWS Console IAM key (for Z6 initial access).
        The agent chooses which path to pursue based on exploration history.

        '
      cost: 1.5
      success_rate: 0.65
      reward: Dual-path credential obtained — GlobalProtect or AWS IAM key available
        for Z4 or Z6 entry
