constraint_vulnerabilities:
  leak_known_credentials:
    name: Solvability.PassTheHash
    type: LOCAL
    description: 'Credential relay supporting both paths: NTLM hash relay from Z2
      perimeter (PATH A) and cloud IAM token extraction from Z6 containers (PATH B).
      S_Lateral uses whichever is available based on the active path.

      '
    cost: 0.5
    success_rate: 0.7
    reward: Cross-zone credential relayed from {target} — perimeter NTLM or cloud
      IAM token obtained
    node_probability: 0.25
    target_coverage: 0.25
    min_targets: 2
    default_port: HTTPS
  leak_neighbors:
    name: Solvability.BloodHound_Recon
    type: LOCAL
    description: 'Network discovery for both paths: ARP/CDP for Z4/Z2 perimeter path,
      container network scan for Z6 cloud path. Both feed the meta-agent''s topological
      awareness for path selection.

      '
    cost: 0.5
    success_rate: 0.85
    reward: Adjacent node {target} discovered — both path topologies being mapped
    node_probability: 0.6
    target_coverage: 0.5
    min_targets: 2
