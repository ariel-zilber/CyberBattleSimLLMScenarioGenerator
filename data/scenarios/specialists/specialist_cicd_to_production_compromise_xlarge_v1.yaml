metadata:
  scenario_id: SPECIALIST-SPECIALIST-META-CICD-TO-PRODUCTION-COMPROMISE-XLARGE-V1
  agent: Meta
  training_mode: specialist_meta
  zones:
  - Z4_InternetEdge
  - Z6_AWSCloud
  - Z1_HQVLANs
  - Z1_ServerFarm
  terminal_goal: DomainController
  intermediate_goals:
  - name: PaloAltoFirewall
    value: 1200
    reason: Z2 milestone on PATH A — signals 4-hop perimeter route is in progress
  - name: AWSAppServer
    value: 1500
    reason: Z6 milestone on PATH B — signals 3-hop cloud route is in progress
  - name: AdminWorkstation
    value: 1200
    reason: S_Lateral milestone — cloud IAM credential relay pivots into Z1 corporate
      Windows admin host
  node_range:
  - 700
  - 950
  attack_path:
  - Probe — both WAF (Z4) and AWSWebServer (Z6) are fingerprinted from internet
  - '[PATH A - 4 hops]: PanOS_CMDInject on WAF → PaloAltoFirewall (Z2) → AdminWorkstation
    (Z1) → DomainController'
  - '[PATH B - 3 hops]: Nginx_Linux_Critical on AWSWebServer → AWSAppServer → CloudIAM_LDAP_Write
    → DomainController'
  - 'Agent selects: PATH B (cloud) is faster — 3 hops vs 4 hops'
  - TERMINAL — DomainController owned (value 10000)
  notes: 'Specialist-meta dataset variant: CI/CD-to-production scenario emphasizing
    cloud/Linux services, network exposure, secrets, and lateral movement into production.

    Size stratum: xlarge; target node range 700-950; target goal count approximately
    8.

    Intended specialist emphasis: S_Linux, S_Network, S_Lateral. Optional/supporting
    specialists: S_Windows, S_Identity.

    Each generated instance should contain meaningful causal segments for 3-4 specialist
    domains,

    include at least one bridge role from S_Identity or S_Lateral, and preserve the
    GLOBALTECH

    reference architecture with external/perimeter, HQ edge, internal/server-farm,
    branch/cloud,

    and management or crown-jewel context. Decoys and supporting assets are allowed
    but must not

    dominate or block the main multi-specialist paths.

    ADVERSARIAL DESIGN: Both paths reach DomainController. PATH A (Z4→Z2→Z1) requires

    4 hops including Z2 perimeter pivot. PATH B (Z6→Z1 cloud bridge) requires only
    3 hops

    using CloudIAM_LDAP_Write. The agent must learn to select PATH B after exploration.

    Neither path is blocked — the scenario tests path selection, not stagnation recovery.

    DomainController is is_goal: true (value 10000) — this is a Stage 4 isolation
    config.

    IdentityProvider property on DomainController enables the Z6→Z1 IAM bridge (PATH
    B).

    '
  source_template: /home/ariel/Documents/thesis/CyberBattleSimLLMScenarioGenerator/data/scenarios/specialist_meta/meta_cicd_to_production_compromise_xlarge_v1.yaml
  fixed_specialists:
  - s_network
  - s_linux
  - s_windows
  - s_identity
  - s_lateral
  vocabulary_source: /home/ariel/Documents/thesis/CyberBattleSim/cyberbattle/data/global_vocabulary.yaml
