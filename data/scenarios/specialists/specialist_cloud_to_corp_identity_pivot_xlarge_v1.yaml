metadata:
  scenario_id: SPECIALIST-SPECIALIST-META-CLOUD-TO-CORP-IDENTITY-PIVOT-XLARGE-V1
  agent: Meta
  training_mode: specialist_meta
  zones:
  - Z6_AWSCloud
  - Z1_HQVLANs
  - Z1_ServerFarm
  - Z8_KeyMgmt
  terminal_goal: CyberArkPAM
  intermediate_goals:
  - name: DomainController
    value: 6000
    reason: 'High-value AD hub — owning DC unlocks Z8 path but episode does NOT terminate.
      Agent must learn the DC is an intermediate milestone, not the final goal.

      '
  - name: AWSAppServer
    value: 2500
    reason: Cloud AppTier milestone — IAM credential extraction point for Z6→Z1 bridge
  - name: AdminWorkstation
    value: 1500
    reason: S_Lateral milestone — cloud-to-corp lateral pivot via IAM relay into Windows
      admin host; gates DomainController path
  node_range:
  - 700
  - 950
  attack_path:
  - Probe — fingerprint AWSWebServer in Z6 WebTier (breach node, public IP)
  - Z6 WebTier exploit — Nginx_Linux_Critical (CVE-2025-15467, SR 0.90) on AWSWebServer
  - Z6 AppTier exploit — Vault_GoStdlib (CVE-2024-41110, SR 0.90) on AWSAppServer
    → AppServer RCE
  - Z6 credential extract — Container_EnvVars on AWSAppServer extracts AD-federated
    IAM token
  - Z6→Z1 bridge — CloudIAM_LDAP_Write (SR 0.65) uses IAM token to write RBCD on DomainController
  - Z1 lateral — Kerberoasting (SR 0.60) on domain-joined workstations
  - Z1 DC — Certifried (CVE-2022-26923, SR 0.88) + noPac (CVE-2021-42287, SR 0.75)
  - 'DCSync on DomainController (value 6000, is_goal: false) — episode continues'
  - DC→Z8 — ADCS_CertSpoof_Lateral (CVE-2022-34691, SR 0.88) → CyberArkPAM auth
  - TERMINAL — CyberArkPAM owned (value 10000, Z8)
  notes: 'Specialist-meta dataset variant: Cloud-to-corporate identity pivot scenario
    emphasizing Linux/cloud compromise, credential relay, and AD escalation.

    Size stratum: xlarge; target node range 700-950; target goal count approximately
    8.

    Intended specialist emphasis: S_Linux, S_Identity, S_Lateral. Optional/supporting
    specialists: S_Network, S_Windows.

    Each generated instance should contain meaningful causal segments for 3-4 specialist
    domains,

    include at least one bridge role from S_Identity or S_Lateral, and preserve the
    GLOBALTECH

    reference architecture with external/perimeter, HQ edge, internal/server-farm,
    branch/cloud,

    and management or crown-jewel context. Decoys and supporting assets are allowed
    but must not

    dominate or block the main multi-specialist paths.

    DomainController is is_goal: false (value 6000). Episode does NOT terminate there.

    CyberArkPAM is is_goal: true (value 10000). Must NOT have Unauthenticated property.

    AWSPostgreSQL (Alpine) has zero REMOTE CVEs — credential-only access from WorkerNode.

    IdentityProvider property on DomainController enables CloudIAM_LDAP_Write Z6→Z1
    bridge.

    The three-domain structure teaches the cloud→corp→PAM kill chain pattern.

    '
  source_template: /home/ariel/Documents/thesis/CyberBattleSimLLMScenarioGenerator/data/scenarios/specialist_meta/meta_cloud_to_corp_identity_pivot_xlarge_v1.yaml
  fixed_specialists:
  - s_network
  - s_linux
  - s_windows
  - s_identity
  - s_lateral
  vocabulary_source: /home/ariel/Documents/thesis/CyberBattleSim/cyberbattle/data/global_vocabulary.yaml
config:
  min_total_nodes: 700
  max_total_nodes: 950
  goal_config:
    num_goals: 3
    selection_strategy: diverse
