start_node:
  subnet: 0.0.0.0/0
  ip: 203.0.113.10
  properties:
  - breach_node
  default_entry_port: HTTPS
  preferred_entry_ports:
  - HTTPS
  - HTTP
  entry_node_count: 1
  leaked_node_coverage: 0.15
  min_leaked_nodes: 2
  port_selection: random
  vulnerabilities:
    discovery:
      name: Solvability.LDAP_Enum
      type: LOCAL
      description: 'Cloud infrastructure enumeration: AWS asset discovery via Shodan/Censys,
        EC2 metadata endpoint probing, and publicly exposed ALB/NginX identifying
        GLOBALTECH AWS web tier in Z6. Identifies nginx version and libcrypto exposure.

        '
      cost: 0.5
      success_rate: 0.85
      reward: GLOBALTECH AWS cloud stack fingerprinted — Z6 WebTier nginx/libcrypto
        version and ALB ARN identified
    credential_leak:
      name: Solvability.SSH_PrivKey_Theft
      type: LOCAL
      description: 'Credential phishing targeting GLOBALTECH cloud engineers — fake
        AWS Console login page harvests one IAM access key for initial Z6 foothold.

        '
      cost: 1.5
      success_rate: 0.65
      reward: AWS IAM access key obtained via phishing — initial Z6 WebTier foothold
        credential acquired
attack_flow:
- source_pattern: AWSWebServer
  targets:
  - AWSAppServer
  - AWSRedis
- source_pattern: AWSAppServer
  targets:
  - AWSWorkerNode
  - AWSPostgreSQL
- source_pattern: AWSWorkerNode
  targets:
  - AWSPostgreSQL
- source_pattern: AWSPostgreSQL
  targets:
  - AdminWorkstation
  - DomainController
- source_pattern: AdminWorkstation
  targets:
  - ExchangeServer
  - FileServer
- source_pattern: ExchangeServer
  targets:
  - DomainController
- source_pattern: FileServer
  targets:
  - DomainController
- source_pattern: DomainController
  targets:
  - CyberArkPAM
constraint_vulnerabilities:
