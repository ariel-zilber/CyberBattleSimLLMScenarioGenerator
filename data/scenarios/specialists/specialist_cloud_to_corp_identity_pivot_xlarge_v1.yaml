    name: Solvability.PassTheHash
    type: LOCAL
    description: 'Hybrid cloud-corporate credential relay: container env vars with
      AD-federated IAM tokens, NTLM hash capture from domain-joined workstations,
      and LSASS dump on compromised Windows nodes.

      '
    cost: 0.5
    success_rate: 0.7
    reward: Cross-zone credential relayed from {target} — cloud IAM or domain credential
      obtained
    node_probability: 0.25
    target_coverage: 0.25
    min_targets: 2
    default_port: HTTPS
  leak_neighbors:
    name: Solvability.BloodHound_Recon
    type: LOCAL
    description: 'Multi-surface network discovery: container network scanning, ARP
      cache, LDAP queries, and AWS VPC flow log analysis to identify adjacent hosts.

      '
    cost: 0.5
    success_rate: 0.85
    reward: Adjacent node {target} discovered via container/ARP/LDAP enumeration
    node_probability: 0.6
    target_coverage: 0.5
    min_targets: 2
