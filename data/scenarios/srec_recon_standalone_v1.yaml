domains:
  - name: GLOBALTECH_Network
    subnet: 10.0.0.0/8
    os_distribution:
      Linux: 0.55
      Windows: 0.35
      NetworkDevice: 0.10
    filler:
      - SalesWorkstation
      - AWSWebServer
      - CiscoEdgeRouter
    mandatory_services:
      - ISPRouter
      - CiscoEdgeRouter
      - PaloAltoFirewall
      - WAFAppliance
      - AWSWebServer
      - AWSAppServer
      - AWSRedis
      - AWSJenkins
      - AWSAuthServer
      - SalesWorkstation
      - AdminWorkstation
      - FinanceWorkstation
      - DomainController
      - FileServer
      - MSSQLServer
    groups:
      - name: ISPRouters
        service: ISPRouter
        min_count: 1
        max_count: 1
      - name: CiscoEdgeRouters
        service: CiscoEdgeRouter
        min_count: 2
        max_count: 6
      - name: PaloAltoFirewalls
        service: PaloAltoFirewall
        min_count: 2
        max_count: 10
      - name: WAFAppliances
        service: WAFAppliance
        min_count: 2
        max_count: 10
      - name: AWSWebServers
        service: AWSWebServer
        min_count: 3
        max_count: 60
      - name: AWSAppServers
        service: AWSAppServer
        min_count: 3
        max_count: 50
      - name: AWSRedis
        service: AWSRedis
        min_count: 2
        max_count: 10
      - name: AWSJenkins
        service: AWSJenkins
        min_count: 2
        max_count: 6
      - name: AWSAuthServers
        service: AWSAuthServer
        min_count: 2
        max_count: 10
      - name: SalesWorkstations
        service: SalesWorkstation
        min_count: 20
        max_count: 250
      - name: AdminWorkstations
        service: AdminWorkstation
        min_count: 10
        max_count: 100
      - name: FinanceWorkstations
        service: FinanceWorkstation
        min_count: 10
        max_count: 150
      - name: DomainControllers
        service: DomainController
        min_count: 2
        max_count: 12
      - name: FileServers
        service: FileServer
        min_count: 3
        max_count: 40
      - name: MSSQLServers
        service: MSSQLServer
        min_count: 2
        max_count: 30
    constraints:
      # === ISPRouters constraints ===
      - source: ISPRouters
        target: breach_node
        relation: MUST_HAVE
      # ISPRouters KNOW adjacent Z4 devices
      - source: ISPRouters
        target: CiscoEdgeRouters
        relation: KNOWS
      - source: ISPRouters
        target: PaloAltoFirewalls
        relation: KNOWS
      # ISPRouters credential chain to Z4 devices
      - source: ISPRouters
        target: CiscoEdgeRouters
        relation: MUST_CONNECT
        protocol: SNMP
      - source: ISPRouters
        target: CiscoEdgeRouters
        relation: LEAK_KNOWN_CREDENTIALS
        protocol: SNMP
      # === CiscoEdgeRouters constraints ===
      # CiscoEdgeRouters KNOW Z6 cloud IPs (from ARP/routing)
      - source: CiscoEdgeRouters
        target: AWSWebServers
        relation: KNOWS
      - source: CiscoEdgeRouters
        target: AWSAppServers
        relation: KNOWS
      # CiscoEdgeRouters → Z6 credential chain (SNMP community → cloud API key)
      - source: CiscoEdgeRouters
        target: AWSWebServers
        relation: MUST_CONNECT
        protocol: HTTPS
      - source: CiscoEdgeRouters
        target: AWSWebServers
        relation: LEAK_KNOWN_CREDENTIALS
        protocol: HTTPS
      - source: CiscoEdgeRouters
        target: AWSJenkins
        relation: MUST_CONNECT
        protocol: HTTPS
      - source: CiscoEdgeRouters
        target: AWSJenkins
        relation: LEAK_KNOWN_CREDENTIALS
        protocol: HTTPS
      # === PaloAltoFirewalls constraints ===
      - source: PaloAltoFirewalls
        target: AWSWebServers
        relation: KNOWS
      - source: PaloAltoFirewalls
        target: CiscoEdgeRouters
        relation: MUST_CONNECT
        protocol: SNMP
      # === WAFAppliances constraints ===
      - source: WAFAppliances
        target: AWSWebServers
        relation: MUST_CONNECT
        protocol: HTTPS
      - source: WAFAppliances
        target: AWSAuthServers
        relation: KNOWS
      # === AWSWebServers constraints ===
      - source: AWSWebServers
        target: AWSAppServers
        relation: MUST_CONNECT
        protocol: HTTPS
      - source: AWSWebServers
        target: AWSRedis
        relation: MUST_CONNECT
        protocol: Redis
      - source: AWSWebServers
        target: AWSAuthServers
        relation: KNOWS
      # AWSWebServers credential chain to AWSAppServers (service-to-service API key)
      - source: AWSWebServers
        target: AWSAppServers
        relation: LEAK_KNOWN_CREDENTIALS
        protocol: HTTPS
      # === AWSAppServers constraints ===
      - source: AWSAppServers
        target: AWSRedis
        relation: MUST_CONNECT
        protocol: Redis
      - source: AWSAppServers
        target: AWSJenkins
        relation: KNOWS
      # AWSAppServers → AWSRedis credential chain (IAM role → Redis token)
      - source: AWSAppServers
        target: AWSRedis
        relation: LEAK_KNOWN_CREDENTIALS
        protocol: Redis
      # === AWSRedis constraints ===
      # AWSRedis credential chain to Z1 Windows (leaked DB/session credentials)
      - source: AWSRedis
        target: SalesWorkstations
        relation: MUST_CONNECT
        protocol: SMB
      - source: AWSRedis
        target: SalesWorkstations
        relation: LEAK_KNOWN_CREDENTIALS
        protocol: SMB
      - source: AWSRedis
        target: FinanceWorkstations
        relation: MUST_CONNECT
        protocol: SMB
      - source: AWSRedis
        target: FinanceWorkstations
        relation: LEAK_KNOWN_CREDENTIALS
        protocol: SMB
      # === AWSAuthServers constraints ===
      - source: AWSAuthServers
        target: SalesWorkstations
        relation: MUST_CONNECT
        protocol: HTTPS
      - source: AWSAuthServers
        target: SalesWorkstations
        relation: LEAK_KNOWN_CREDENTIALS
        protocol: HTTPS
      # AWSAuthServers KNOW domain-joined nodes (via AD federation LDAP queries)
      - source: AWSAuthServers
        target: DomainControllers
        relation: KNOWS
      # === AWSJenkins constraints ===
      # AWSJenkins credential chain to Z1 (CI/CD pipeline service account creds)
      - source: AWSJenkins
        target: DomainControllers
        relation: MUST_CONNECT
        protocol: LDAP
      - source: AWSJenkins
        target: DomainControllers
        relation: LEAK_KNOWN_CREDENTIALS
        protocol: LDAP
      - source: AWSJenkins
        target: FileServers
        relation: MUST_CONNECT
        protocol: SMB
      - source: AWSJenkins
        target: FileServers
        relation: LEAK_KNOWN_CREDENTIALS
        protocol: SMB
      # === SalesWorkstations constraints ===
      - source: SalesWorkstations
        target: DomainControllers
        relation: MUST_CONNECT
        protocol: Kerberos
      - source: SalesWorkstations
        target: DomainControllers
        relation: LEAK_KNOWN_CREDENTIALS
        protocol: Kerberos
      - source: SalesWorkstations
        target: FileServers
        relation: MUST_CONNECT
        protocol: SMB
      # === FinanceWorkstations constraints ===
      - source: FinanceWorkstations
        target: FileServers
        relation: MUST_CONNECT
        protocol: SMB
      - source: FinanceWorkstations
        target: MSSQLServers
        relation: MUST_CONNECT
        protocol: MSSQL
      # === FileServers constraints ===
      - source: FileServers
        target: DomainControllers
        relation: MUST_CONNECT
        protocol: Kerberos
      - source: FileServers
        target: DomainControllers
        relation: LEAK_KNOWN_CREDENTIALS
        protocol: Kerberos
      - source: FileServers
        target: MSSQLServers
        relation: MUST_CONNECT
        protocol: MSSQL
      # === DomainControllers constraints ===
      - source: DomainControllers
        target: AdminCredentials
        relation: MUST_HAVE
      - source: DomainControllers
        target: DomainAdmin
        relation: MUST_HAVE
      - source: DomainControllers
        target: SensitiveData
        relation: MUST_HAVE
      # DomainControllers → AdminWorkstations (WinRM credential cache → GOAL)
      - source: DomainControllers
        target: AdminWorkstations
        relation: LEAK_KNOWN_CREDENTIALS
        protocol: WinRM
      - source: DomainControllers
        target: AdminWorkstations
        relation: MUST_CONNECT
        protocol: WinRM
      # DomainControllers KNOW all Z1 nodes (via LDAP/DNS)
      - source: DomainControllers
        target: SalesWorkstations
        relation: KNOWS
      - source: DomainControllers
        target: FinanceWorkstations
        relation: KNOWS
      - source: DomainControllers
        target: FileServers
        relation: KNOWS
      - source: DomainControllers
        target: MSSQLServers
        relation: KNOWS
      # === AdminWorkstations constraints ===
      - source: AdminWorkstations
        target: AdminCredentials
        relation: MUST_HAVE
      - source: AdminWorkstations
        target: SensitiveData
        relation: MUST_HAVE

entry_points:
  - domain: GLOBALTECH_Network
    node: ISPRouters

solvability_rules:
  entry_point_requirements:
    min_remote_vulnerabilities: 1
    min_credential_leaking_vulnerabilities: 1
  lateral_movement_requirements:
    min_credential_leaking_nodes: 0.65
  auto_fix_enabled: true
  auto_fix_strategies:
    - add_remote_vulnerability_to_entry
    - add_credential_leakage
    - add_lateral_movement_vulnerabilities

credential_banks:
  bank_types:
    - guest
    - network_admin
    - cloud_iam
    - cloud_service
    - domain_user
    - local_admin
    - admin
    - service_admin
    - domain_admin
    - enterprise_admin
    - db_admin
  categorization_rules:
    - group_pattern: "Router"
      banks: [network_admin, admin]
    - group_pattern: "Firewall"
      banks: [network_admin]
    - group_pattern: "AWS"
      banks: [cloud_iam, cloud_service]
    - group_pattern: "Workstation"
      banks: [guest, domain_user]
    - group_pattern: "Admin"
      banks: [local_admin, domain_user]
    - group_pattern: "DomainController"
      banks: [domain_admin, enterprise_admin, service_admin, admin]
    - group_pattern: "MSSQL"
      banks: [db_admin, admin]
    - group_pattern: "FileServer"
      banks: [admin, service_admin, domain_user]
    - properties: [Windows, WindowsServer]
      banks: [local_admin, domain_user]
    - properties: [DomainAdmin, AdminCredentials]
      banks: [domain_admin, enterprise_admin]
