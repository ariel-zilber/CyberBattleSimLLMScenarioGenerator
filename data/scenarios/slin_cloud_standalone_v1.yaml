domains:
  - name: Z6_WebTier
    subnet: 10.3.1.0/24
    os_distribution:
      Linux: 1.0
    filler:
      - AWSWebServer
    mandatory_services:
      - AWSWebServer
      - AWSGitLab
    groups:
      - name: AWSWebServers
        service: AWSWebServer
        min_count: 3
        max_count: 60
      - name: AWSGitLabs
        service: AWSGitLab
        min_count: 2
        max_count: 6
    constraints:
      - source: AWSWebServers
        target: ImageMagick
        relation: MUST_HAVE
      - source: AWSWebServers
        target: WordPressInstall
        relation: MUST_HAVE

  - name: Z6_AppTier
    subnet: 10.3.2.0/24
    os_distribution:
      Linux: 1.0
    filler:
      - AWSAppServer
    mandatory_services:
      - AWSAppServer
      - AWSJenkins
      - AWSAuthServer
    groups:
      - name: AWSAppServers
        service: AWSAppServer
        min_count: 3
        max_count: 60
      - name: AWSJenkinsNodes
        service: AWSJenkins
        min_count: 2
        max_count: 6
      - name: AWSAuthServers
        service: AWSAuthServer
        min_count: 2
        max_count: 10
    constraints:
      - source: AWSAppServers
        target: AWSJenkinsNodes
        relation: MUST_CONNECT
        protocol: HTTPS
      - source: AWSAppServers
        target: AWSAuthServers
        relation: MUST_CONNECT
        protocol: HTTPS

  - name: Z6_WorkerTier
    subnet: 10.3.3.0/24
    os_distribution:
      Linux: 1.0
    filler:
      - AWSWorkerNode
    mandatory_services:
      - AWSWorkerNode
      - AWSRabbitMQ
    groups:
      - name: AWSWorkerNodes
        service: AWSWorkerNode
        min_count: 3
        max_count: 60
      - name: AWSRabbitMQNodes
        service: AWSRabbitMQ
        min_count: 3
        max_count: 12
    constraints:
      - source: AWSWorkerNodes
        target: AWSRabbitMQNodes
        relation: MUST_CONNECT
        protocol: AMQP
      - source: AWSWorkerNodes
        target: Kubernetes
        relation: MUST_HAVE
      - source: AWSWorkerNodes
        target: Pod
        relation: MUST_HAVE

  - name: Z6_DataTier
    subnet: 10.3.4.0/24
    os_distribution:
      Linux: 0.75
      Alpine: 0.25
    filler:
      - AWSRedis
    mandatory_services:
      - AWSRedis
      - AWSPostgreSQL
      - AWSMySQL
      - AWSElasticsearch
    groups:
      - name: AWSRedisNodes
        service: AWSRedis
        min_count: 2
        max_count: 10
      - name: AWSPostgreSQLNodes
        service: AWSPostgreSQL
        min_count: 2
        max_count: 10
      - name: AWSMySQLNodes
        service: AWSMySQL
        min_count: 2
        max_count: 8
      - name: AWSElasticsearchNodes
        service: AWSElasticsearch
        min_count: 3
        max_count: 15
    constraints:
      - source: AWSRedisNodes
        target: Misconfigured
        relation: MUST_HAVE
      - source: AWSRedisNodes
        target: SensitiveData
        relation: MUST_HAVE

inter_domain_constraints:
  - source_domain: Z6_WebTier
    target_domain: Z6_AppTier
    constraints:
      - source: AWSWebServers
        target: AWSAppServers
        relation: MUST_CONNECT
        protocol: HTTPS
      - source: AWSGitLabs
        target: AWSAppServers
        relation: MUST_CONNECT
        protocol: HTTPS

  - source_domain: Z6_AppTier
    target_domain: Z6_WorkerTier
    constraints:
      - source: AWSAppServers
        target: AWSWorkerNodes
        relation: MUST_CONNECT
        protocol: Kafka
      - source: AWSJenkinsNodes
        target: AWSWorkerNodes
        relation: MUST_CONNECT
        protocol: HTTPS

  - source_domain: Z6_WorkerTier
    target_domain: Z6_DataTier
    constraints:
      - source: AWSWorkerNodes
        target: AWSRedisNodes
        relation: MUST_CONNECT
        protocol: Redis
      - source: AWSWorkerNodes
        target: AWSPostgreSQLNodes
        relation: MUST_CONNECT
        protocol: PostgreSQL
      - source: AWSRabbitMQNodes
        target: AWSRedisNodes
        relation: MUST_CONNECT
        protocol: Redis

entry_points:
  - domain: Z6_WebTier
    node: AWSWebServers

solvability_rules:
  entry_point_requirements:
    min_remote_vulnerabilities: 1
    min_credential_leaking_vulnerabilities: 1
  lateral_movement_requirements:
    min_credential_leaking_nodes: 0.60
  auto_fix_enabled: true
  auto_fix_strategies:
    - add_remote_vulnerability_to_entry
    - add_credential_leakage
    - add_lateral_movement_vulnerabilities

credential_banks:
  bank_types:
    - user
    - admin
    - root
    - db_admin
    - web_admin
    - service_admin
    - aws_iam_key
  categorization_rules:
    - group_pattern: "WebServer"
      banks: [user, web_admin]
    - group_pattern: "AppServer"
      banks: [user, admin, service_admin]
    - group_pattern: "Redis"
      banks: [db_admin, admin]
    - group_pattern: "PostgreSQL"
      banks: [db_admin, admin]
    - group_pattern: "MySQL"
      banks: [db_admin, admin]
    - properties: [Linux, Alpine, Debian]
      banks: [root, user]
    - properties: [Kubernetes, Pod]
      banks: [service_admin, aws_iam_key]
    - properties: [GoRuntime, Java, Python]
      banks: [service_admin, user]
