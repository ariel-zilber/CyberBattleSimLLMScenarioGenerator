# =============================================================================
# S-LIN-01: Cloud Container Breakout — Standalone Specialist Training
# Agent: S_Cloud
# Zones: Z6 (AWS Cloud, 4 tiers: WebTier / AppTier / WorkerTier / DataTier)
# Terminal goal: AWSRedis (value 10000, is_goal: true)
# Nodes: 30–250
# =============================================================================
#
# SCENARIO OVERVIEW:
#   The attacker targets GLOBALTECH's AWS Cloud Zone (Z6). A containerized
#   microservice stack exposes WordPress/Nginx in the WebTier. The path:
#   exploit a critical CVE on AWSWebServer → extract WordPress DB credentials
#   → pivot to AWSAppServer → container escape into WorkerTier → reach the
#   unauthenticated AWSRedis cluster (Misconfigured) as the terminal goal.
#
# ATTACK PATH:
#   1. Probe — fingerprint container distro (Linux/Alpine)
#   2. Web tier entry — WordPress ImageMagick RCE (CVE-2026-22770, SR 0.90)
#      or Nginx LibCrypto RCE (CVE-2025-15467, SR 0.90)
#   3. Credential extraction — WordPressDB_Creds (SR 0.75) from wp-config.php
#   4. App tier — Vault GoStdlib RCE (SR 0.90) or Keycloak SSRF (SR 0.88)
#   5. Worker tier — Kafka LibXML RCE (SR 0.90) or Airflow RCE (SR 0.90)
#   6. Data tier — Redis_DataDump (SR 0.70) on unauthenticated AWSRedis
#      → TERMINAL GOAL
#
# GLOBALTECH ZONE REFERENCE:
#   Z6 WebTier    10.3.1.0/24   HTTPS entry from internet
#   Z6 AppTier    10.3.2.0/24   REST/HTTPS from WebTier
#   Z6 WorkerTier 10.3.3.0/24   Kafka from AppTier
#   Z6 DataTier   10.3.4.0/24   Redis/PostgreSQL from WorkerTier + AppTier
# =============================================================================

config:
  min_total_nodes: 30
  max_total_nodes: 250
  goal_config:
    num_goals: 1
    selection_strategy: diverse

identifiers:
  standard_ports:
    - HTTP
    - HTTPS
    - SSH
    - Redis
    - PostgreSQL
    - MySQL
    - Kafka
    - AMQP
    - Elasticsearch
  standard_ports_extra:
    - DNS
    - NTP
  base_properties:
    # Attacker marker
    - breach_node
    # OS families
    - Linux
    - Alpine
    - Debian
    # Node roles
    - WebServer
    - NginxServer
    - AppServer
    - AuthServer
    - WorkerNode
    - DatabaseServer
    # Runtime environments
    - PHP
    - Python
    - Java
    - GoRuntime
    # Application properties
    - ImageMagick
    - WordPressInstall
    - LibCrypto
    - Redis
    - MySQL
    - PostgreSQL
    - KeycloakService
    # Container/orchestration
    - Kubernetes
    - Pod
    - Container
    # Security posture
    - Misconfigured
    - Unpatched
    - SensitiveData
    - AdminCredentials
    - SSHKey

os_management_ports:
  Linux: SSH
  Alpine: SSH
  default: SSH

start_node:
  subnet: 0.0.0.0/0
  ip: 203.0.113.10
  properties:
    - breach_node
  default_entry_port: HTTPS
  preferred_entry_ports:
    - HTTPS
    - HTTP
  entry_node_count: 1
  leaked_node_coverage: 0.10
  min_leaked_nodes: 1
  port_selection: random
  vulnerabilities:
    discovery:
      name: External.Cloud.Recon
      type: LOCAL
      description: "HTTP fingerprinting, TLS certificate inspection, and web application scanning to identify WordPress version, exposed API endpoints, and container platform (EKS/K8s)."
      cost: 0.5
      success_rate: 0.90
      reward: "Cloud-hosted WordPress stack detected — web tier endpoints, PHP version, and S3 bucket paths identified"
    credential_leak:
      name: External.Cloud.PublicS3
      type: LOCAL
      description: "Enumerate public S3 buckets and GitHub Actions secrets exposed in public CI/CD pipelines associated with the target domain."
      cost: 1.0
      success_rate: 0.35
      reward: "Leaked IAM key or S3 object found in public repository — cloud credential obtained"

attack_flow:
  - source_pattern: AWSWebServer
    targets:
      - AWSGitLab
      - AWSAppServer
  - source_pattern: AWSGitLab
    targets:
      - AWSAppServer
  - source_pattern: AWSAppServer
    targets:
      - AWSJenkins
      - AWSAuthServer
      - AWSWorkerNode
  - source_pattern: AWSJenkins
    targets:
      - AWSWorkerNode
  - source_pattern: AWSAuthServer
    targets:
      - AWSWorkerNode
  - source_pattern: AWSWorkerNode
    targets:
      - AWSRedis
      - AWSRabbitMQ
  - source_pattern: AWSRabbitMQ
    targets:
      - AWSRedis

constraint_vulnerabilities:
  leak_known_credentials:
    name: Local.Cloud.EnvCredLeak
    type: LOCAL
    description: "Extract database connection string or IAM key from container environment variables, mounted K8s secrets, or application config files discovered on an owned container."
    cost: 0.5
    success_rate: 0.70
    reward: "Database credentials or IAM key extracted from container config on {target} — lateral access to data tier now possible"
    node_probability: 0.65
    target_coverage: 0.60
    min_targets: 1
    default_port: Redis
  leak_neighbors:
    name: Local.Container.NetScan
    type: LOCAL
    description: "Internal nmap scan from a compromised container to enumerate adjacent tier services (Redis 6379, PostgreSQL 5432, MySQL 3306, Kafka 9092)."
    cost: 0.5
    success_rate: 0.85
    reward: "Container network scan revealed neighbor service {target}"
    node_probability: 0.60
    target_coverage: 0.55
    min_targets: 1

probe_vulnerabilities:
  - name: Remote.Probe.Linux
    os: Linux
    type: REMOTE
    description: "Identifies Linux container OS, web server version, and application stack via HTTP headers, SSH banner, and service fingerprinting."
    cost: 0.5
    success_rate: 1.0
  - name: Remote.Probe.Alpine
    os: Alpine
    type: REMOTE
    description: "Identifies Alpine-based container via HTTP headers and SSH hostkey algorithm fingerprint (ed25519-only)."
    cost: 0.5
    success_rate: 1.0

solvability_vulnerabilities:
  remote_access:

    # ── Web Tier ─────────────────────────────────────────────────────────────
    - name: Solvability.WordPress_ImageMagick
      type: REMOTE
      description: "CVE-2026-22770 — ImageMagick BilateralBlurImage uninitialized buffer in wordpress chart image. CVSS 9.8. Triggered via malicious image upload through WordPress media handler."
      cost: 1.0
      success_rate: 0.90
      reward: "WordPress ImageMagick RCE (CVE-2026-22770) achieved — shell on AWSWebServer"
      match_properties:
        - Linux
        - PHP
        - WebServer
        - ImageMagick
      probability: 0.85

    - name: Solvability.WordPress_ImageMagick_2
      type: REMOTE
      description: "CVE-2026-23876 — Second ImageMagick critical RCE in the wordpress chart image. CVSS 9.8. Alternate code path via image processing pipeline."
      cost: 1.0
      success_rate: 0.90
      reward: "WordPress ImageMagick RCE (CVE-2026-23876) achieved — alternate shell on AWSWebServer"
      match_properties:
        - Linux
        - PHP
        - WebServer
        - ImageMagick
      probability: 0.65

    - name: Solvability.Nginx_LibCrypto_Critical
      type: REMOTE
      description: "CVE-2025-15467 — libcrypto3 critical vulnerability in Nginx Bitnami image. CVSS 9.8. Exploitable via malformed TLS ClientHello on HTTPS listener."
      cost: 1.0
      success_rate: 0.90
      reward: "Nginx LibCrypto RCE (CVE-2025-15467) achieved — shell on web-tier reverse proxy"
      match_properties:
        - Linux
        - WebServer
        - LibCrypto
      probability: 0.80

    - name: Solvability.Ghost_Critical
      type: REMOTE
      description: "CVE-2024-21508 — mysql2 critical RCE in Ghost CMS chart. CVSS 9.8. Exploitable via crafted SQL query in the Ghost publishing API."
      cost: 1.0
      success_rate: 0.90
      reward: "Ghost CMS mysql2 RCE (CVE-2024-21508) achieved — shell on AWSGitLab web service"
      match_properties:
        - WebServer
        - Linux
        - AppServer
      probability: 0.70

    - name: Solvability.Gitea_High
      type: REMOTE
      description: "CVE-2023-52425 — libexpat1 HIGH vulnerability in Gitea chart. CVSS 7.5. Exploitable via malformed XML in Gitea repository webhook payload."
      cost: 1.5
      success_rate: 0.75
      reward: "Gitea libexpat RCE (CVE-2023-52425) achieved — shell on source control server"
      match_properties:
        - AppServer
        - Linux
        - GoRuntime
      probability: 0.65

    # ── App Tier ─────────────────────────────────────────────────────────────
    - name: Solvability.Vault_GoStdlib
      type: REMOTE
      description: "CVE-2024-41110 — stdlib critical in HashiCorp Vault chart. CVSS 9.9. HTTP/2 CONTINUATION frame flood enables remote code execution on the Vault API server."
      cost: 1.0
      success_rate: 0.90
      reward: "Vault GoStdlib RCE (CVE-2024-41110) achieved — shell on AWSAppServer, Vault unsealed"
      match_properties:
        - Linux
        - AppServer
        - GoRuntime
      probability: 0.80

    - name: Solvability.Vault_GoStdlib_2
      type: REMOTE
      description: "CVE-2025-0377 — Second stdlib critical in Vault. CVSS 9.1. Alternate path via Vault agent auto-auth endpoint."
      cost: 1.0
      success_rate: 0.90
      reward: "Vault GoStdlib RCE (CVE-2025-0377) achieved — alternate shell on app tier"
      match_properties:
        - Linux
        - AppServer
        - GoRuntime
      probability: 0.60

    - name: Solvability.Jenkins_RCE
      type: REMOTE
      description: "CVE-2026-35414 — Jenkins RCE via Groovy script console. CVSS 8.1. Requires Jenkins web UI accessible from network with default credentials or token."
      cost: 1.5
      success_rate: 0.57
      reward: "Jenkins Groovy RCE (CVE-2026-35414) achieved — CI pipeline host compromised"
      match_properties:
        - Linux
        - AppServer
        - Java
      probability: 0.70

    - name: Solvability.Keycloak_SSRF
      type: REMOTE
      description: "CVE-2026-1486 — Keycloak SSRF via OAuth redirect_uri parameter. CVSS 8.8. Allows probing internal services behind the auth server."
      cost: 1.5
      success_rate: 0.88
      reward: "Keycloak SSRF (CVE-2026-1486) achieved — internal network enumerated via auth server redirect"
      match_properties:
        - Linux
        - AuthServer
        - Java
        - KeycloakService
      probability: 0.75

    - name: Solvability.OAuthProxy_RCE
      type: REMOTE
      description: "CVE-2026-34457 — oauth2-proxy GoStdlib critical RCE. CVSS 9.1. HTTP/2 exploitation enables code execution on the OAuth proxy service."
      cost: 1.0
      success_rate: 0.90
      reward: "OAuthProxy GoStdlib RCE (CVE-2026-34457) achieved — shell on auth proxy"
      match_properties:
        - Linux
        - AuthServer
        - GoRuntime
      probability: 0.70

    # ── Worker Tier ───────────────────────────────────────────────────────────
    - name: Solvability.Kafka_LibXML
      type: REMOTE
      description: "CVE-2024-56171 — libxml2 critical in Kafka Bitnami chart. CVSS 9.8. Exploitable via malformed XML in Kafka Connect REST API configuration payload."
      cost: 1.0
      success_rate: 0.90
      reward: "Kafka libxml2 RCE (CVE-2024-56171) achieved — shell on AWSWorkerNode message broker"
      match_properties:
        - Linux
        - WorkerNode
        - Java
      probability: 0.80

    - name: Solvability.Airflow_RCE
      type: REMOTE
      description: "CVE-2024-12084 — Python runtime critical in Apache Airflow chart. CVSS 9.8. Deserialization of malicious DAG pickle enables OS command execution."
      cost: 1.0
      success_rate: 0.90
      reward: "Airflow DAG pickle RCE (CVE-2024-12084) achieved — worker node scheduler compromised"
      match_properties:
        - Linux
        - WorkerNode
        - Python
      probability: 0.75

    # ── Data Tier (lateral reach via REMOTE CVE before goal_access) ───────────
    - name: Solvability.Redis_GoStdlib
      type: REMOTE
      description: "CVE-2023-24538 — GoStdlib critical in Redis Bitnami chart. CVSS 9.8. Template injection in Go HTML/text template evaluation enables RCE on the Redis management interface."
      cost: 1.0
      success_rate: 0.90
      reward: "Redis GoStdlib RCE (CVE-2023-24538) achieved — data-tier shell obtained, unauthenticated Redis exposed"
      match_properties:
        - Linux
        - DatabaseServer
        - Redis
        - GoRuntime
      probability: 0.65

    - name: Solvability.MySQL_RCE
      type: REMOTE
      description: "CVE-2026-27459 — MySQL RCE via UDF injection in Bitnami chart. CVSS 9.8. Exploitable with valid credentials to execute arbitrary OS commands."
      cost: 1.0
      success_rate: 0.90
      reward: "MySQL RCE (CVE-2026-27459) achieved — data-tier database shell obtained"
      match_properties:
        - Linux
        - DatabaseServer
        - MySQL
      probability: 0.70

    - name: Solvability.Elasticsearch_RCE
      type: REMOTE
      description: "CVE-2025-66516 — Elasticsearch critical RCE in Bitnami chart. CVSS 9.8. Remote code execution via malicious Painless script in search request."
      cost: 1.0
      success_rate: 0.90
      reward: "Elasticsearch RCE (CVE-2025-66516) achieved — search tier data accessible"
      match_properties:
        - Linux
        - DatabaseServer
        - Java
      probability: 0.65

  credential_leak:
    - name: Solvability.WordPressDB_Creds
      type: LOCAL
      description: "Read wp-config.php from the compromised WordPress container filesystem. Contains DB_NAME, DB_USER, DB_PASSWORD in plaintext — always present on WordPress deployments."
      cost: 0.5
      success_rate: 0.75
      reward: "MySQL/Redis credentials extracted from wp-config.php — data-tier access credentials obtained"
      match_properties:
        - Linux
        - PHP
        - WebServer
        - WordPressInstall
      probability: 0.80

    - name: Solvability.Redis_NoAuth
      type: LOCAL
      description: "Connect to unauthenticated Redis instance (no requirepass set). KEYS * returns all cache keys; CONFIG GET returns replication details."
      cost: 0.5
      success_rate: 0.80
      reward: "Unauthenticated Redis (no requirepass) connected — session tokens and application secrets exposed"
      match_properties:
        - Linux
        - DatabaseServer
        - Redis
        - Misconfigured
      probability: 0.85

    - name: Solvability.Container_EnvVars
      type: LOCAL
      description: "Enumerate container environment variables for injected K8s Secrets (DB_PASSWORD, REDIS_URL, AWS_SECRET_ACCESS_KEY) present in the running container."
      cost: 0.5
      success_rate: 0.60
      reward: "Container environment variables dumped — database connection string and IAM key candidates extracted"
      match_properties:
        - Linux
      probability: 0.75

    - name: Solvability.KubeServiceAccount
      type: LOCAL
      description: "Read the mounted Kubernetes service account JWT from /var/run/secrets/kubernetes.io/serviceaccount/token. Used to enumerate RBAC permissions against K8s API."
      cost: 0.5
      success_rate: 0.70
      reward: "K8s service account JWT extracted — cluster API accessible with pod's RBAC permissions"
      match_properties:
        - Linux
        - Kubernetes
        - Pod
      probability: 0.70

    - name: Solvability.Kafka_ConfigLeak
      type: LOCAL
      description: "Read Kafka PLAINTEXT listener bootstrap credentials from the Kafka container broker configuration file (server.properties)."
      cost: 0.5
      success_rate: 0.70
      reward: "Kafka SASL/PLAINTEXT bootstrap credentials extracted — message queue lateral access available"
      match_properties:
        - Linux
        - WorkerNode
        - Java
      probability: 0.65

  discovery:
    - name: Solvability.Container_NetScan
      type: LOCAL
      description: "Run nmap/masscan inside compromised container to discover adjacent tier services on the internal VPC network (Redis 6379, PostgreSQL 5432, Kafka 9092)."
      cost: 0.5
      success_rate: 0.80
      reward: "Container network scan complete — adjacent tier services mapped"
      match_properties:
        - Linux
      probability: 0.85

    - name: Solvability.K8s_APIEnum
      type: LOCAL
      description: "Enumerate Kubernetes API server for pod names, service IPs, and config maps using the mounted service account JWT or default RBAC permissions."
      cost: 0.5
      success_rate: 0.75
      reward: "K8s API enumeration complete — pod topology, service endpoints, and namespace boundaries identified"
      match_properties:
        - Linux
        - Kubernetes
        - Pod
      probability: 0.75

    - name: Solvability.Nmap_Internal
      type: LOCAL
      description: "Full internal host discovery scan within the VPC subnet to enumerate all live hosts and open ports across all tiers."
      cost: 1.0
      success_rate: 0.85
      reward: "Internal VPC network mapped — all reachable tier services enumerated"
      match_properties:
        - Linux
      probability: 0.80

  goal_access:
    - name: Solvability.Redis_DataDump
      type: LOCAL
      description: "KEYS * + GET all values from unauthenticated Redis cluster. Extracts session tokens, cached credentials, and application data from the in-memory store."
      cost: 0.5
      success_rate: 0.70
      reward: "Full Redis data dump achieved — session tokens, API keys, and cached credentials extracted from AWSRedis"
      match_properties:
        - Linux
        - DatabaseServer
        - Redis
        - SensitiveData
      probability: 0.85

    - name: Solvability.Vault_SecretsDump
      type: LOCAL
      description: "Read all secrets from an unsealed HashiCorp Vault instance. Vault is unsealed in the development/staging deployment, exposing all stored application secrets."
      cost: 1.0
      success_rate: 0.55
      reward: "HashiCorp Vault secrets dump achieved — all application secrets extracted from unsealed Vault"
      match_properties:
        - Linux
        - AppServer
        - GoRuntime
        - AdminCredentials
      probability: 0.60

    - name: Solvability.MySQL_DataExfil
      type: LOCAL
      description: "mysqldump --all-databases to exfiltrate all database content including user PII and application records."
      cost: 1.0
      success_rate: 0.65
      reward: "Full MySQL data exfiltration achieved — all databases dumped from AWSMySQL"
      match_properties:
        - Linux
        - DatabaseServer
        - MySQL
        - SensitiveData
      probability: 0.70

    - name: Solvability.K8sSecretsDump
      type: LOCAL
      description: "Extract all K8s service account tokens and Opaque secrets from etcd using cluster-admin privileges obtained via privilege escalation."
      cost: 1.5
      success_rate: 0.65
      reward: "K8s etcd secrets dump achieved — all namespace service account tokens extracted"
      match_properties:
        - Linux
        - Kubernetes
        - Pod
      probability: 0.55

