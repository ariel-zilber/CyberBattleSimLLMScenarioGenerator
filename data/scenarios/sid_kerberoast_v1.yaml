metadata:
  scenario_id: S-ID-S01
  agent: S_Identity
  training_mode: standalone
  zones: [Z1_VLAN, Z1_ServerFarm]
  terminal_goal: DomainController
  intermediate_goals:
    - name: MSSQLServer
      value: 5000
      reason: Target of Silver Ticket access
  node_range: [15, 30]
  attack_path:
    - "Entry — Phishing yields domain user credentials"
    - "Recon — BloodHound reveals Kerberoastable accounts"
    - "Kerberoast — TGS crack yields SQL service account credentials"
    - "Silver Ticket — Forged ticket grants access to MSSQLServer"
    - "DCSync — SQL account has high privileges, allows DCSync on DomainController"

config:
  min_total_nodes: 15
  max_total_nodes: 30
  goal_config:
    num_goals: 1
    selection_strategy: diverse

identifiers:
  standard_ports: [RDP, SMB, LDAP, Kerberos, HTTPS, MSSQL]
  base_properties:
    - breach_node
    - Windows
    - Workstation
    - MSSQLServer
    - DomainController
    - Kerberoastable
    - DomainJoined
    - DomainAdmin

os_management_ports:
  Windows: RDP
  default: RDP

start_node:
  subnet: 0.0.0.0/0
  ip: 203.0.113.10
  properties: [breach_node]
  vulnerabilities:
    credential_leak:
      name: External.Phishing
      type: LOCAL
      description: "Harvests domain credentials"
      cost: 1.0
      success_rate: 0.7

attack_flow:
  - source_pattern: Workstation
    targets: [MSSQLServer]
  - source_pattern: MSSQLServer
    targets: [DomainController]

solvability_vulnerabilities:
  remote_access:
    - name: Solvability.EternalBlue
      type: REMOTE
      description: "CVE-2017-0144 MS17-010"
      match_properties: [Windows]
      success_rate: 0.8
      cost: 1.0
  credential_leak:
    - name: Solvability.Kerberoasting
      type: LOCAL
      description: "Kerberoasting AD technique"
      match_properties: [Workstation, DomainJoined]
      success_rate: 0.6
      cost: 1.5
      probability: 0.8
  discovery:
    - name: Solvability.BloodHound_Recon
      type: LOCAL
      description: "AD Recon"
      match_properties: [DomainJoined]
      success_rate: 0.8
      cost: 1.0
  goal_access:
    - name: Solvability.DCSync
      type: LOCAL
      description: "DCSync goal access"
      match_properties: [DomainController, DomainAdmin]
      success_rate: 0.5
      cost: 2.5
      goal_category: dump

services:
  Workstation:
    port: RDP
    value: 100
    allowed_os: [Windows]
    default_properties: [Windows, Workstation, DomainJoined]
  MSSQLServer:
    port: MSSQL
    value: 5000
    allowed_os: [Windows]
    default_properties: [Windows, MSSQLServer, Kerberoastable, DomainJoined]
  DomainController:
    port: LDAP
    value: 10000
    allowed_os: [Windows]
    default_properties: [Windows, DomainController, DomainAdmin, DomainJoined]
    is_goal: true

domains:
  - name: internal
    subnet: 10.0.0.0/24
    groups:
      - name: workstations
        service: Workstation
        min_count: 10
        max_count: 20
      - name: sql_servers
        service: MSSQLServer
        min_count: 2
        max_count: 5
      - name: dcs
        service: DomainController
        min_count: 1
        max_count: 1
    constraints:
      - source: workstations
        target: sql_servers
        relation: MUST_CONNECT
        protocol: MSSQL
      - source: sql_servers
        target: dcs
        relation: MUST_CONNECT
        protocol: LDAP

entry_points:
  - domain: internal
    node: workstations

solvability_rules:
  lateral_movement_requirements:
    min_credential_leaking_nodes: 0.5
