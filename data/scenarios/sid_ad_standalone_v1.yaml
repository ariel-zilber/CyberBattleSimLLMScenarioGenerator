inter_domain_constraints:
  - source_domain: Z1_HQVLANs
    target_domain: Z1_ServerFarm
    constraints:
      # SalesWorkstations → FileServers (SMB file share access — standard domain user)
      - source: SalesWorkstations
        target: FileServers
        relation: MUST_CONNECT
        protocol: SMB
      # AdminWorkstations → server tier (admin management — AD CS, Exchange, Print, File)
      # Intentionally NO AdminWorkstations → DomainControllers cross-domain
      # (forces path: Admin → ServerFarm intermediate → DC = depth 3)
      - source: AdminWorkstations
        target: ADCS_Servers
        relation: MUST_CONNECT
        protocol: HTTPS
      - source: AdminWorkstations
        target: ExchangeServers
        relation: MUST_CONNECT
        protocol: HTTPS
      - source: AdminWorkstations
        target: PrintServers
        relation: MUST_CONNECT
        protocol: SMB
      - source: AdminWorkstations
        target: FileServers
        relation: MUST_CONNECT
        protocol: SMB
      # FinanceWorkstations → FileServers (finance data access)
      - source: FinanceWorkstations
        target: FileServers
        relation: MUST_CONNECT
        protocol: SMB

entry_points:
  - domain: Z1_HQVLANs
    node: SalesWorkstations

solvability_rules:
  entry_point_requirements:
    min_remote_vulnerabilities: 1
    min_credential_leaking_vulnerabilities: 1
  lateral_movement_requirements:
    min_credential_leaking_nodes: 0.55
  auto_fix_enabled: true
  auto_fix_strategies:
    - add_remote_vulnerability_to_entry
    - add_credential_leakage
    - add_lateral_movement_vulnerabilities

credential_banks:
  bank_types:
    - guest
    - domain_user
    - local_admin
    - admin
    - service_admin
    - domain_admin
    - enterprise_admin
    - krbtgt
    - db_admin
  categorization_rules:
    - group_pattern: "Workstation"
      banks: [guest, domain_user]
    - group_pattern: "Admin"
      banks: [local_admin, domain_user]
    - group_pattern: "DomainController"
      banks: [domain_admin, enterprise_admin, service_admin, admin, krbtgt]
    - group_pattern: "MSSQL"
      banks: [db_admin, admin]
    - group_pattern: "ADCS"
      banks: [service_admin, admin]
    - group_pattern: "Exchange"
      banks: [service_admin, admin]
    - group_pattern: "FileServer"
      banks: [admin, service_admin, domain_user]
    - properties: [Windows, WindowsServer]
      banks: [local_admin, domain_user]
    - properties: [DomainAdmin, AdminCredentials]
      banks: [domain_admin, enterprise_admin]
