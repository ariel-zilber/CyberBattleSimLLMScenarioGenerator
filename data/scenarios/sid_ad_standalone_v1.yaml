    subnet: 10.1.0.0/24
    os_distribution:
      Windows: 1.0
    filler:
      - SalesWorkstation
      - FinanceWorkstation
    mandatory_services:
      - SalesWorkstation
      - AdminWorkstation
      - FinanceWorkstation
    groups:
      - name: SalesWorkstations
        service: SalesWorkstation
        min_count: 1
        max_count: 1
      - name: AdminWorkstations
        service: AdminWorkstation
        min_count: 5
        max_count: 30
