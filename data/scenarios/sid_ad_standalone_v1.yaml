# =============================================================================
# S-ID-01: Active Directory Domain Takeover — Standalone Specialist Training
# Agent: S_AD
# Zones: Z1 HQ VLANs (10.1.0.0/24) + Z1 Server Farm (10.1.10.0/24)
# Terminal goal: DomainController (value 10000, is_goal: true)
# Nodes: 30–200
# =============================================================================
#
# SCENARIO OVERVIEW:
#   The perimeter (Z4/Z2) is absent — S_Identity operates entirely inside Z1.
#   SalesWorkstation is the pre-owned breach node (SR 1.0 trivial entry) with
#   DomainJoined property set, modeling the handoff from S_Windows.
#   The agent's challenge: AD protocol escalation from an existing domain
#   foothold — ADCS abuse, NTLM relay, Kerberos attacks, certificate privesc.
#
# ATTACK PATH:
#   1. Probe — Remote.Probe.Windows fingerprints OS/patch/AD-joined status
#   2. VLAN entry — SR 1.0 trivial probe on SalesWorkstation (breach_node)
#   3. Credential harvest — Kerberoasting (SR 0.60) / Mimikatz_NTLM (SR 0.65)
#      on AdminWorkstation / FinanceWorkstation
#   4. PrintNightmare (SR 0.88) / SpoolSample (SR 0.78) on PrintServer
#      → NTLM hash coercion, relay to ADCS
#   5. ADCS_ESC1_Remote (SR 0.60) / ADCS_ESC8_Remote (SR 0.55) on ADCS_Server
#      → domain admin certificate via misconfigured template
#   6. Exchange_NTLM_Relay (SR 0.90) on ExchangeServer → LDAP attribute write
#   7. Certifried (SR 0.88) / noPac (SR 0.75) on DomainController
#   8. DCSync (SR 0.60) / NTDS_Dump (SR 0.60) on DomainController
#      → TERMINAL GOAL
#
# ATTACK FLOW DEPTH (min hops SalesWorkstation → DomainController):
#   SalesWorkstation → AdminWorkstation (hop 1)
#   AdminWorkstation → ADCS_Server / ExchangeServer / PrintServer (hop 2)
#   ADCS_Server / ExchangeServer / PrintServer → DomainController (hop 3)
#   Minimum depth = 3 ✓
#
# GLOBALTECH ZONE REFERENCE:
#   Z1 HQ VLANs     10.1.0.0/24   Workstation VLANs (Sales/Finance/Admin)
#   Z1 Server Farm  10.1.10.0/24  File/IIS/MSSQL/Print/ADCS/Exchange/HyperV/DC
# =============================================================================

config:
  min_total_nodes: 30
  max_total_nodes: 200
  goal_config:
    num_goals: 1
    selection_strategy: diverse

identifiers:
  standard_ports:
    - RDP
    - SMB
    - HTTPS
    - HTTP
    - LDAP
    - LDAPS
    - Kerberos
    - MSSQL
    - WinRM
    - SSH
  standard_ports_extra:
    - DNS
    - NTP
    - SMTP
    - LSASS
    - MSRPC
  base_properties:
    # Attacker marker
    - breach_node
    # OS families
    - Windows
    - WindowsServer
    - Win2019
    - Win2022
    - Win10
    - Win7
    # Domain membership / roles
    - DomainJoined
    - DomainController
    - DomainAdmin
    - LocalAdmin
    # Node roles
    - WorkStation
    - FileServer
    - PrintServer
    - MailServer
    - WebServer
    - IISServer
    - DatabaseServer
    - MSSQLServer
    - HyperVHost
    # AD / PKI roles
    - ADCS
    - VulnerableTemplate
    - AD_KerberosKDC
    - DNSServer
    # Vulnerability properties
    - SMBv1
    - SMB
    - PrintSpooler
    - WDigest
    - NoLAPS
    - ASREProastable
    - Kerberoastable
    - FinancialData
    - SensitiveData
    - AdminCredentials
    - Unpatched

os_management_ports:
  Windows: RDP
  WindowsServer: RDP
  default: RDP

start_node:
  subnet: 0.0.0.0/0
  ip: 203.0.113.20
  properties:
    - breach_node
  default_entry_port: RDP
  preferred_entry_ports:
    - RDP
    - SMB
  entry_node_count: 1
  leaked_node_coverage: 0.20
  min_leaked_nodes: 2
  port_selection: random
  vulnerabilities:
    discovery:
      name: External.AD.DomainRecon
      type: LOCAL
      description: "OSINT and port scanning to identify exposed RDP/SMB endpoints, enumerate AD domain FQDN via DNS/LDAP, and map domain-joined hosts from external network. Identifies domain trust relationships and exposed services."
      cost: 0.5
      success_rate: 0.90
      reward: "Active Directory domain identified — externally reachable RDP/SMB endpoints mapped, AD domain FQDN and forest structure resolved"
    credential_leak:
      name: External.Phishing.DomainCredHarvest
      type: LOCAL
      description: "Spear-phishing campaign targeting domain users with fake Microsoft 365 / Outlook Web Access login portal. Harvests one valid set of domain credentials from SalesWorkstation user with DomainJoined context."
      cost: 1.5
      success_rate: 0.50
      reward: "Domain user credentials obtained via phishing — initial domain foothold credential for SalesWorkstation established"

attack_flow:
  - source_pattern: SalesWorkstation
    targets:
      - AdminWorkstation
      - FinanceWorkstation
  - source_pattern: AdminWorkstation
    targets:
      - PrintServer
      - ADCS_Server
      - ExchangeServer
      - FileServer
  - source_pattern: FinanceWorkstation
    targets:
      - FileServer
  - source_pattern: PrintServer
    targets:
      - DomainController
  - source_pattern: ADCS_Server
    targets:
      - DomainController
  - source_pattern: ExchangeServer
    targets:
      - DomainController
  - source_pattern: FileServer
    targets:
      - ExchangeServer
      - MSSQLServer
      - IISServer
      - HyperVHost
  - source_pattern: IISServer
    targets:
      - DomainController
  - source_pattern: MSSQLServer
    targets:
      - DomainController
  - source_pattern: HyperVHost
    targets:
      - DomainController

constraint_vulnerabilities:
  leak_known_credentials:
    name: Local.AD.CredentialCache
    type: LOCAL
    description: "Extract cached domain credentials from Windows Credential Manager, LSASS memory (Mimikatz sekurlsa), or domain credential cache on compromised domain-joined Windows hosts."
    cost: 0.5
    success_rate: 0.70
    reward: "Cached domain credentials extracted from {target} — lateral movement credential obtained for AD environment"
    node_probability: 0.65
    target_coverage: 0.55
    min_targets: 2
    default_port: SMB
  leak_neighbors:
    name: Local.AD.NetDiscovery
    type: LOCAL
    description: "Windows net commands, ARP cache enumeration, LDAP queries, and SMB share browsing to discover adjacent domain-joined hosts on the same VLAN/subnet."
    cost: 0.5
    success_rate: 0.85
    reward: "Domain-joined neighbor {target} discovered via SMB/ARP/LDAP enumeration"
    node_probability: 0.60
    target_coverage: 0.55
    min_targets: 2

probe_vulnerabilities:
  - name: Remote.Probe.Windows
    os: Windows
    type: REMOTE
    description: "Identifies Windows OS version, patch level, and domain membership via RDP protocol negotiation, SMB v1/v2 banner, and NetBIOS name enumeration."
    cost: 0.5
    success_rate: 1.0
  - name: Remote.Probe.WindowsServer
    os: WindowsServer
    type: REMOTE
    description: "Identifies Windows Server version (2016/2019/2022) and installed roles including AD CS, KDC, DNS via SMB banner, LDAP signing requirements, and HTTP Negotiate header."
    cost: 0.5
    success_rate: 1.0

solvability_vulnerabilities:
  remote_access:

    # ── Trivial breach_node entry ─────────────────────────────────────────────
    - name: Solvability.BreachNode_Entry
      type: REMOTE
      description: "SR 1.0 trivial probe on pre-owned breach node. Models the completed S_Windows handoff — SalesWorkstation is already domain-joined and owned when the episode starts."
      cost: 0.5
      success_rate: 1.0
      reward: "Breach node SalesWorkstation owned — S_Windows handoff complete, DomainJoined foothold established in Z1 VLANs"
      match_properties:
        - Windows
        - breach_node
      probability: 1.0

    # ── Print Spooler coercion attacks ────────────────────────────────────────
    - name: Solvability.PrintNightmare
      type: REMOTE
      description: "CVE-2021-34527 — PrintNightmare Windows Print Spooler RCE. CVSS 8.8. Unauthenticated remote code execution via DLL injection in the AddPrinterDriverEx RPC call, exploitable before any patch deployment on Win2019 print servers."
      cost: 1.5
      success_rate: 0.88
      reward: "PrintNightmare RCE (CVE-2021-34527) achieved — SYSTEM shell on PrintServer, Print Spooler machine account hash captured for relay"
      match_properties:
        - Windows
        - PrintSpooler
        - Win2019
      probability: 0.80

    - name: Solvability.SpoolSample
      type: REMOTE
      description: "CVE-2022-38028 — Windows Print Spooler credential relay. CVSS 7.8. Forces Print Spooler service to authenticate to attacker-controlled UNC path via MS-RPRN, capturing machine NTLM hash for relay to ADCS ESC8 HTTP enrollment endpoint."
      cost: 1.0
      success_rate: 0.78
      reward: "SpoolSample coercion (CVE-2022-38028) achieved — PrintServer machine NTLM hash captured for ADCS relay"
      match_properties:
        - Windows
        - PrintSpooler
      probability: 0.75

    # ── PetitPotam NTLM coercion on DomainController ──────────────────────────
    - name: Solvability.PetitPotam
      type: REMOTE
      description: "CVE-2021-36942 — PetitPotam unauthenticated NTLM coercion. CVSS 7.5. Exploits MS-EFSRPC to force domain controller machine account authentication to attacker-controlled SMB listener, enabling NTLM relay to ADCS (ESC8) for domain admin certificate."
      cost: 1.5
      success_rate: 0.75
      reward: "PetitPotam NTLM coercion (CVE-2021-36942) achieved — DC machine account NTLM auth relayed to ADCS web enrollment"
      match_properties:
        - Windows
        - DomainController
      probability: 0.70

    # ── Certifried / ADCS CVEs on DomainController ────────────────────────────
    - name: Solvability.Certifried
      type: REMOTE
      description: "CVE-2022-26923 — Certifried Active Directory Certificate Services privilege escalation. CVSS 8.8. Manipulates machine account dNSHostName attribute to impersonate a domain controller, then enrolls a certificate that grants DA-level PKINIT authentication."
      cost: 1.5
      success_rate: 0.88
      reward: "Certifried ADCS privesc (CVE-2022-26923) achieved — domain controller impersonation certificate obtained, DA-level TGT via PKINIT"
      match_properties:
        - Windows
        - DomainController
        - ADCS
      probability: 0.75

    - name: Solvability.noPac
      type: REMOTE
      description: "CVE-2021-42287 — noPac SAM Account Name Impersonation. CVSS 7.5. Domain user with default create-computer-account right manipulates sAMAccountName to impersonate a DC, requesting Kerberos service ticket as DA without any local admin rights."
      cost: 1.5
      success_rate: 0.75
      reward: "noPac SAM impersonation (CVE-2021-42287) achieved — domain admin TGT obtained via Kerberos sAMAccountName spoofing"
      match_properties:
        - Windows
        - DomainController
        - DomainJoined
      probability: 0.65

    # ── ZeroLogon on DomainController ─────────────────────────────────────────
    - name: Solvability.ZeroLogon
      type: REMOTE
      description: "CVE-2020-1472 — ZeroLogon Netlogon cryptographic flaw. Exploits a trivially bypassable AES-CFB8 PRNG in MS-NRPC to authenticate as the DC machine account with empty password, enabling immediate DCSync for all domain hashes."
      cost: 2.0
      success_rate: 0.70
      reward: "ZeroLogon Netlogon exploit (CVE-2020-1472) achieved — domain controller machine account impersonated, domain fully compromised"
      match_properties:
        - Windows
        - DomainController
      probability: 0.65

    # ── Exchange Server NTLM relay ─────────────────────────────────────────────
    - name: Solvability.Exchange_NTLM_Relay
      type: REMOTE
      description: "CVE-2024-21410 — Microsoft Exchange Server NTLM credential relay. CVSS 9.8. Exchange relays client NTLM credentials to LDAP service, enabling privilege escalation through RBCD (Resource-Based Constrained Delegation) write to machine account."
      cost: 1.0
      success_rate: 0.90
      reward: "Exchange NTLM relay (CVE-2024-21410) achieved — RBCD written to machine account via relayed Exchange NTLM, domain admin path unlocked"
      match_properties:
        - Windows
        - MailServer
      probability: 0.75

    # ── WinRM RCE (lateral movement to ADCS/admin servers) ───────────────────
    - name: Solvability.WinRM_RCE
      type: REMOTE
      description: "CVE-2021-31958 — Windows Remote Management (WinRM) buffer overflow RCE. CVSS 7.5. Stack-based buffer overflow in the WinRM HTTP listener allows authenticated RCE on domain-joined servers, pivoting to ADCS and management hosts."
      cost: 1.5
      success_rate: 0.75
      reward: "WinRM RCE (CVE-2021-31958) achieved — SYSTEM shell on domain-joined server via WinRM buffer overflow, ADCS enrollment available"
      match_properties:
        - Windows
        - DomainJoined
      probability: 0.55

    # ── ADCS ESC attacks via ADCS_Server (VulnerableTemplate) ────────────────
    - name: Solvability.ADCS_ESC1_Remote
      type: REMOTE
      description: "ADCS ESC1 — Certificate template Subject Alternative Name enrollment abuse. Misconfigured template allows any authenticated domain user to specify an arbitrary SAN (including DA UPN) when enrolling a certificate, then use PKINIT to obtain DA TGT."
      cost: 1.5
      success_rate: 0.60
      reward: "ADCS ESC1 certificate enrolled — domain admin UPN in SAN, DA TGT obtained via PKINIT Kerberos authentication"
      match_properties:
        - Windows
        - ADCS
        - VulnerableTemplate
      probability: 0.70

    - name: Solvability.ADCS_ESC8_Remote
      type: REMOTE
      description: "ADCS ESC8 — NTLM relay attack against ADCS HTTP certificate enrollment endpoint (certsrv). Relay DC machine account NTLM authentication to the CA web enrollment page to obtain a certificate for the DC, then PKINIT for DA TGT."
      cost: 1.5
      success_rate: 0.55
      reward: "ADCS ESC8 HTTP relay achieved — DC certificate enrolled via NTLM relay to ADCS certsrv, DA TGT obtained via PKINIT"
      match_properties:
        - Windows
        - ADCS
        - VulnerableTemplate
      probability: 0.65

  credential_leak:
    - name: Solvability.Mimikatz_NTLM
      type: LOCAL
      description: "Dump NTLM password hashes from LSASS memory using Mimikatz sekurlsa::logonpasswords on a compromised domain-joined Windows host. Harvests cached domain user and service account NTLM hashes."
      cost: 0.5
      success_rate: 0.65
      reward: "NTLM hash dump from LSASS achieved — domain user and service account NTLM hashes obtained for relay and offline cracking"
      match_properties:
        - Windows
        - DomainJoined
      probability: 0.75

    - name: Solvability.Kerberoasting
      type: LOCAL
      description: "Request TGS Kerberos service tickets for all SPN-registered Kerberoastable service accounts in AD. Offline NTLM/AES cracking of TGS tickets reveals service account plaintext passwords without triggering account lockout."
      cost: 1.0
      success_rate: 0.60
      reward: "Kerberoasting TGS tickets harvested — Kerberoastable service account hashes obtained for offline cracking, potential DA password exposed"
      match_properties:
        - Windows
        - Kerberoastable
        - DomainJoined
      probability: 0.65

    - name: Solvability.ASREPRoasting
      type: LOCAL
      description: "AS-REP Roasting against Kerberos accounts with 'Do not require Kerberos preauthentication' flag. Requests AS-REP messages offline and cracks TGT partial key for AS-REProastable accounts without any authentication."
      cost: 1.0
      success_rate: 0.55
      reward: "AS-REP Roasting cracked — ASREProastable domain user account password obtained, foothold credential refreshed"
      match_properties:
        - Windows
        - ASREProastable
        - DomainJoined
      probability: 0.60

    - name: Solvability.PassTheHash
      type: LOCAL
      description: "NTLM Pass-the-Hash lateral movement to domain-joined hosts lacking LAPS (local admin password solution). Same local admin NTLM hash reused across machines enables SMB session without cracking the password."
      cost: 0.5
      success_rate: 0.65
      reward: "Pass-the-Hash lateral movement succeeded — local admin session on LAPS-absent neighbor host via NTLM hash relay"
      match_properties:
        - Windows
        - NoLAPS
        - DomainJoined
      probability: 0.70

    - name: Solvability.LSA_Secrets
      type: LOCAL
      description: "Extract LSA secrets from HKLM\\SECURITY\\Policy\\Secrets registry hive on a compromised Windows host. Reveals service account plaintexts, cached domain credentials (mscachev2 hashes), and DPAPI master key material."
      cost: 0.5
      success_rate: 0.65
      reward: "LSA secrets extracted — service account passwords, mscachev2 domain credential hashes, and DPAPI master keys obtained"
      match_properties:
        - Windows
        - DomainJoined
      probability: 0.65

    - name: Solvability.HiveNightmare
      type: LOCAL
      description: "CVE-2021-36934 — HiveNightmare / SeriousSAM. Overly permissive ACLs on Volume Shadow Copies grant non-admin read access to SAM, SYSTEM, and SECURITY hive files, enabling NTLM hash extraction without SeDebugPrivilege."
      cost: 0.5
      success_rate: 0.78
      reward: "HiveNightmare SAM hive read (CVE-2021-36934) — local NTLM hashes extracted from VSS shadow copy without admin privileges"
      match_properties:
        - Windows
        - LocalAdmin
      probability: 0.60

  discovery:
    - name: Solvability.BloodHound_Recon
      type: LOCAL
      description: "BloodHound/SharpHound Active Directory enumeration. Ingests LDAP/Kerberos data to map all domain trust relationships, admin group memberships, Kerberoastable accounts, and shortest paths to Domain Admin via ADCS, delegation, and group memberships."
      cost: 1.0
      success_rate: 0.80
      reward: "BloodHound AD attack graph built — shortest path to DomainController identified, ADCS ESC paths and Kerberoastable accounts listed"
      match_properties:
        - Windows
        - DomainJoined
      probability: 0.85

    - name: Solvability.LDAP_Enum
      type: LOCAL
      description: "LDAP queries against domain controller for all AD objects: users, computers, groups, GPOs, SPNs, ASREProastable accounts, ADCS certificate templates, and ACL delegations."
      cost: 0.5
      success_rate: 0.80
      reward: "LDAP enumeration complete — full AD inventory including ADCS templates, SPN accounts, and delegation configurations"
      match_properties:
        - Windows
        - DomainController
      probability: 0.80

    - name: Solvability.SMB_ShareEnum
      type: LOCAL
      description: "Enumerate accessible SMB shares on domain-joined Windows file servers. Discovers admin shares (C$, ADMIN$, SYSVOL, NETLOGON), GPP cpassword files, and sensitive data staging directories."
      cost: 0.5
      success_rate: 0.70
      reward: "SMB share enumeration complete — SYSVOL/NETLOGON mapped, GPP cpassword and sensitive file share paths identified"
      match_properties:
        - Windows
        - FileServer
        - SMBv1
      probability: 0.75

    - name: Solvability.Nmap_Internal
      type: LOCAL
      description: "Internal network host discovery scan to identify all domain-joined Windows hosts, open LDAP/Kerberos/RPC ports, and ADCS web enrollment endpoints within Z1 subnets."
      cost: 1.0
      success_rate: 0.85
      reward: "Internal AD network scan complete — all domain-joined hosts, ADCS endpoints, and KDC ports enumerated"
      match_properties:
        - Windows
      probability: 0.80

  goal_access:
    - name: Solvability.DCSync
      type: LOCAL
      description: "DS-Replication-Get-Changes-All privilege abuse via Mimikatz dcsync module. Simulates a domain controller replication request to dump all NTLM hashes including krbtgt. Requires DA or equivalent replication rights (or certificate-based DA from ADCS abuse)."
      cost: 0.5
      success_rate: 0.60
      reward: "DCSync domain hash dump achieved — all NTLM hashes including krbtgt extracted from DomainController via DS-Replication"
      match_properties:
        - Windows
        - DomainController
        - DomainAdmin
      probability: 0.75

    - name: Solvability.NTDS_Dump
      type: LOCAL
      description: "Extract NTDS.dit Active Directory database via vssadmin Volume Shadow Copy creation and SYSTEM hive backup. Offline decryption of all domain password hashes using impacket secretsdump."
      cost: 1.0
      success_rate: 0.60
      reward: "NTDS.dit extracted via VSS shadow copy — full domain hash database and Kerberos keys obtained for offline decryption"
      match_properties:
        - Windows
        - DomainController
        - DomainAdmin
      probability: 0.70

    - name: Solvability.GoldenTicket
      type: LOCAL
      description: "Forge a Kerberos Golden Ticket using the extracted krbtgt NTLM hash. Ticket valid for 10 years, bypasses all password resets, and grants persistent domain admin access to all Kerberos-authenticated services."
      cost: 1.0
      success_rate: 0.55
      reward: "Golden Ticket forged with krbtgt hash — persistent domain admin Kerberos TGT created, domain compromise persists beyond password resets"
      match_properties:
        - Windows
        - DomainController
        - AdminCredentials
      probability: 0.65

    - name: Solvability.ADCS_ESC1
      type: LOCAL
      description: "ADCS ESC1 goal-stage — use domain admin certificate obtained from misconfigured ADCS template (SAN enrollment) to perform PKINIT Kerberos auth as DA, then execute DCSync to complete domain takeover."
      cost: 0.5
      success_rate: 0.60
      reward: "ADCS ESC1 domain takeover complete — DA certificate PKINIT auth succeeded, DCSync executed via certificate-based DA privileges"
      match_properties:
        - Windows
        - DomainController
        - ADCS
      probability: 0.70

    - name: Solvability.ADCS_ESC8
      type: LOCAL
      description: "ADCS ESC8 goal-stage — use DC certificate obtained via NTLM relay to ADCS HTTP enrollment (certsrv) to perform PKINIT as DC, then execute S4U2Self for DA impersonation and final DCSync."
      cost: 1.0
      success_rate: 0.55
      reward: "ADCS ESC8 relay chain complete — DC certificate PKINIT→S4U2Self→DCSync achieved, all domain hashes exfiltrated"
      match_properties:
        - Windows
        - ADCS
        - DomainController
      probability: 0.65

