        relation: MUST_HAVE
      - source: SalesWorkstations
        target: DomainJoined
        relation: MUST_HAVE
      - source: AdminWorkstations
        target: AdminCredentials
        relation: MUST_HAVE
      - source: AdminWorkstations
        target: DomainJoined
        relation: MUST_HAVE
      - source: FinanceWorkstations
        target: FinancialData
        relation: MUST_HAVE
      - source: SalesWorkstations
        target: AdminWorkstations
